<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Code on Wages CBT Practice</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mu:#5d6670;--bd:#d7dbe0;--ac:#1a5fb4;--ok:#1e8e3e;--no:#d93025;--mk:#8e44ad;--sk:#9aa3ad}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1d2126;--tx:#e8eaed;--mu:#9aa3ad;--bd:#343a41;--ac:#6aa6f5;--ok:#4cc477;--no:#f0766d;--mk:#c58be0;--sk:#6b747e}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:960px;margin:0 auto;padding:12px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
h1{font-size:1.3rem;margin:.2rem 0 .8rem}h2{font-size:1.05rem;margin:.2rem 0 .6rem}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 14px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}button:disabled{opacity:.4}
label{display:flex;gap:8px;align-items:center;padding:4px 0}select,input[type=number]{font:inherit;padding:6px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:90px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--bd)}
.opt{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;margin:8px 0;cursor:pointer}
.opt.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 15%,transparent)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.pal button{padding:6px 0;font-size:.85rem;background:var(--sk);color:#fff;border:0}.pal .a{background:var(--ok)}.pal .n{background:var(--no)}.pal .m{background:var(--mk)}.pal .c{outline:3px solid var(--ac)}
.lg{font-size:.8rem;color:var(--mu)}.big{font-size:2rem;font-weight:700}.mu{color:var(--mu)}
.ex{margin-top:8px;padding:10px;border-left:4px solid var(--ac);background:var(--bg);border-radius:6px;font-size:.92rem}
.tag{font-size:.75rem;color:var(--mu)}
</style></head><body><div class="w" id="app"></div>
<script>
const Q=[{"set":"Set 1 – Mixed MCQs","n":1,"q":"When did Code on Wages receive the Presidential assent?","o":{"A":"July 2019","B":"August 2019","C":"September 2019","D":"October 2019"},"a":"B","e":""},{"set":"Set 1 – Mixed MCQs","n":2,"q":"Identify the incorrect statement among the following. As per Code on Wages, 2019, a contractor is a person:","o":{"A":"who undertakes to produce a given result for the establishment through contract labour","B":"who undertakes mere supply of goods or articles of manufacture to any establishment","C":"including a sub-contractor","D":"who supplies contract labour for any work of the establishment as mere human resource"},"a":"B","e":""},{"set":"Set 1 – Mixed MCQs","n":3,"q":"No court shall take cognizance of any offence punishable under the Code, save on a complaint made by ____.","o":{"A":"Safety Committee","B":"District Magistrate","C":"Employee","D":"None of the above"},"a":"C","e":""},{"set":"Set 1 – Mixed MCQs","n":4,"q":"‘Contract labour’ under the Code on Wages, 2019 includes ____.","o":{"A":"Worker employed on regular basis by a contractor for his own establishment","B":"Inter-state migrant worker","C":"Both A and B","D":"Neither A nor B"},"a":"B","e":""},{"set":"Set 1 – Mixed MCQs","n":5,"q":"‘Direct tax’ under the Code on Wages, 2019 does not specifically include:","o":{"A":"Income-tax Act, 1961","B":"Companies (Profits) Surtax Act, 1964","C":"Agricultural income tax law","D":"Wealth Tax"},"a":"D","e":""},{"set":"Set 1 – Mixed MCQs","n":6,"q":"Inspector-cum-Facilitator under Code on Wages, 2019 is a person appointed by ____.","o":{"A":"Appropriate Government","B":"Central Government","C":"State Government","D":"Labour Court"},"a":"A","e":""},{"set":"Set 1 – Mixed MCQs","n":7,"q":"As per the provisions of Code on Wages, 2019, which of the following is part of ‘wages’ of a workman?","o":{"A":"Retaining Allowance","B":"House Rent Allowance","C":"Bonus","D":"Overtime Allowance"},"a":"A","e":""},{"set":"Set 1 – Mixed MCQs","n":8,"q":"Up to which percentage of a workman’s ‘wage’ may wages in kind be paid, forming part of wages?","o":{"A":"10%","B":"12%","C":"15%","D":"20%"},"a":"C","e":""},{"set":"Set 1 – Mixed MCQs","n":9,"q":"‘Worker’ under Code on Wages, 2019 shall not include ____.","o":{"A":"An officer of a prison","B":"Supervisor drawing remuneration not exceeding Rs. 15,000","C":"Working journalists","D":"Sales promotion employees"},"a":"A","e":""},{"set":"Set 1 – Mixed MCQs","n":10,"q":"Based on Code on Wages, 2019, identify the incorrect statement:","o":{"A":"The number of minimum rates of wages may, as far as possible, be kept at minimum by the appropriate Government.","B":"No employer shall pay less than the minimum rate of wages notified by the appropriate Government.","C":"The appropriate Government shall fix the minimum rate of wages payable to employees.","D":"The appropriate Government shall fix a minimum rate of wages for time work only."},"a":"D","e":""},{"set":"Set 1 – Mixed MCQs","n":11,"q":"Which of the following is/are a part or component of ‘minimum wages’ under Code on Wages, 2019? (i) Basic wage (ii) Cost of living allowance (iii) Cash value of supply of essential commodities at a concessional rate. Choose the correct option.","o":{"A":"(i) and (ii) only","B":"(i) only","C":"(i) and (iii) only","D":"(i), (ii) and (iii)"},"a":"D","e":""},{"set":"Set 1 – Mixed MCQs","n":12,"q":"The procedure for fixing and revising minimum wages under Code on Wages, 2019 is taken from which Labour Act?","o":{"A":"Payment of Wages Act, 1936","B":"Equal Remuneration Act, 1976","C":"Minimum Wages Act, 1948","D":"Factories Act, 1948"},"a":"C","e":""},{"set":"Set 1 – Mixed MCQs","n":13,"q":"Identify the incorrect statement(s) with respect to Code on Wages, 2019 and choose the correct option. (i) The Appropriate Government shall fix floor wage taking into account minimum living standards of a worker. (ii) The ‘minimum rates’ of wages shall not be less than the ‘floor wage’. (iii) If the ‘minimum rates’ of wages are more than the ‘floor wage’, the appropriate Government shall not reduce the ‘minimum rates’.","o":{"A":"(i) only","B":"(i) and (ii) only","C":"(ii) and (iii) only","D":"(iii) only"},"a":"A","e":""},{"set":"Set 1 – Mixed MCQs","n":14,"q":"Consider the two statements and choose the correct option. Statement I: If an employee works for less than the requisite number of hours constituting a normal working day, he shall be entitled to wages for a full normal working day if his failure to work is due to the employer’s omission to provide him with work. Statement II: Where a person is employed on piece work for which a minimum ‘time-rate’ and not a minimum ‘piece-rate’ has been fixed, the employer shall pay at not less than the minimum piece rate.","o":{"A":"Statement I and Statement II, both are correct","B":"Statement I and Statement II, both are incorrect","C":"Statement I is correct and Statement II is incorrect","D":"Statement I is incorrect and Statement II is correct"},"a":"C","e":""},{"set":"Set 1 – Mixed MCQs","n":15,"q":"Under the provisions of Code on Wages, which class of employees or employment is subject to prescribed conditions while fixing hours of work for a normal working day by the Appropriate Government, where minimum rates of wages have been fixed?","o":{"A":"Employees whose employment is essentially intermittent","B":"Employees engaged in work which could not be carried on except at times dependent on the irregular action of natural forces","C":"Employees engaged in work which for technical reasons has to be completed before the duty is over","D":"All of the above"},"a":"D","e":""},{"set":"Set 1 – Mixed MCQs","n":16,"q":"Under the Code on Wages, 2019, all wages shall be paid in/by ____.","o":{"A":"Cash","B":"Cheque or electronic mode","C":"Crediting wages in the bank account of the employee","D":"All of the above"},"a":"D","e":""},{"set":"Set 1 – Mixed MCQs","n":17,"q":"As per Code on Wages, 2019, in case of removal or dismissal of an employee, wages should be paid within ____ from the date of such event.","o":{"A":"7 working days","B":"2 working days","C":"15 working days","D":"One month"},"a":"B","e":""},{"set":"Set 1 – Mixed MCQs","n":18,"q":"Under the Code on Wages, 2019, which of the following is not a permissible deduction from wages?","o":{"A":"Deductions for payment to a co-operative society","B":"Deductions for contribution to the Prime Minister’s National Relief Fund or such other fund","C":"Deductions for house accommodation","D":"None of the above"},"a":"D","e":""},{"set":"Set 1 – Mixed MCQs","n":19,"q":"What is the maximum percentage of permissible deductions allowed from wages in any wage period under the Code on Wages, 2019?","o":{"A":"20%","B":"10%","C":"30%","D":"50%"},"a":"D","e":""},{"set":"Set 1 – Mixed MCQs","n":20,"q":"Under the Code on Wages, 2019, no fine shall be imposed on any employee who is under the age of ____.","o":{"A":"18 years","B":"15 years","C":"12 years","D":"14 years"},"a":"B","e":""},{"set":"Set 1 – Mixed MCQs","n":21,"q":"Under the Code on Wages, 2019, if 10 or more persons absent themselves without due notice and without reasonable cause, the deductions may include up to ____ days’ wages.","o":{"A":"8","B":"5","C":"10","D":"6"},"a":"A","e":""},{"set":"Set 1 – Mixed MCQs","n":22,"q":"Match the provisions under the Code on Wages, 2019 with the prescribed deductions. List I: (i) shall not exceed the loss to the employer; (ii) from the first payment of wages; (iii) shall not be made unless accepted by the employee as a term of employment. List II: (a) deductions for services rendered; (b) deductions for recovery of advances before employment begins; (c) deductions for damage.","o":{"A":"(i) (ii) (iii): (b) (a) (c)","B":"(i) (ii) (iii): (a) (b) (c)","C":"(i) (ii) (iii): (c) (b) (a)","D":"(i) (ii) (iii): (b) (c) (a)"},"a":"C","e":""},{"set":"Set 1 – Mixed MCQs","n":23,"q":"Under Chapter IV of Code on Wages, 2019, the total bonus including annual minimum bonus and bonus linked with productivity cannot exceed what percentage of wages earned in the accounting year?","o":{"A":"20%","B":"25%","C":"8.33%","D":"22%"},"a":"A","e":""},{"set":"Set 1 – Mixed MCQs","n":24,"q":"What is the minimum number of working days required under Code on Wages, 2019 for making an employee eligible for payment of bonus?","o":{"A":"30","B":"60","C":"80","D":"100"},"a":"A","e":""},{"set":"Set 1 – Mixed MCQs","n":25,"q":"What percentage of ‘available surplus’ is prescribed under Code on Wages, 2019 as allocable surplus in an establishment other than a banking company?","o":{"A":"60%","B":"67%","C":"50%","D":"57%"},"a":"B","e":""},{"set":"Set 1 – Mixed MCQs","n":26,"q":"With respect to Chapter IV (Payment of Bonus) under Code on Wages, 2019, consider the statements: (i) Gross profits derived by an employer will be calculated in the manner prescribed by the Appropriate Government. (ii) Allocable surplus for any accounting year = Gross profits − sums deductible from gross profits. (iii) In calculating direct tax as a deduction from gross profits, account shall be taken of any loss incurred by the employer in respect of any previous accounting year and carried forward and any arrears of depreciation. Choose the correct code.","o":{"A":"All statements are incorrect","B":"All statements are correct","C":"Statements (i) and (iii) are incorrect and (ii) is correct","D":"Only statement (iii) is correct"},"a":"A","e":""},{"set":"Set 1 – Mixed MCQs","n":27,"q":"Where for any accounting year the ‘allocable surplus’ exceeds ‘maximum bonus payable’ to employees, the excess shall be carried forward for being ‘set on’ in succeeding accounting years and so on up to and inclusive of the ____ accounting year, to be utilised for payment of bonus.","o":{"A":"3rd","B":"4th","C":"5th","D":"6th"},"a":"B","e":""},{"set":"Set 1 – Mixed MCQs","n":28,"q":"Under the provisions of Code on Wages, what is the maximum time limit by which the Appropriate Government may extend the time period for payment of bonus?","o":{"A":"One year","B":"Two years","C":"Three years","D":"Five years"},"a":"B","e":""},{"set":"Set 1 – Mixed MCQs","n":29,"q":"Chapter IV (Payment of Bonus) of Code on Wages, 2019 is applicable to a public sector enterprise only where it sells goods in competition with the private sector and the gross income from that business is not less than ____.","o":{"A":"10%","B":"5%","C":"15%","D":"20%"},"a":"D","e":""},{"set":"Set 1 – Mixed MCQs","n":30,"q":"Chapter IV (Payment of Bonus) of Code on Wages, 2019 is not applicable to ____.","o":{"A":"Employees of Central Government, State Government or a local authority","B":"Employees of Reserve Bank of India","C":"Employees of Indian Red Cross Society","D":"All of the above"},"a":"D","e":""},{"set":"Set 1 – Mixed MCQs","n":31,"q":"The provisions of Chapter IV (Payment of Bonus) of Code on Wages, 2019 shall apply to an establishment in which ____ persons are employed or were employed on any day during an accounting year.","o":{"A":"10 or more","B":"15 or more","C":"20 or more","D":"100 or more"},"a":"C","e":""},{"set":"Set 1 – Mixed MCQs","n":32,"q":"Under Chapter V (Advisory Board) of Code on Wages, 2019, the number of independent persons should not exceed ____ of the total members of the Central/State Advisory Board.","o":{"A":"One-third","B":"Two-third","C":"One-half","D":"One-fourth"},"a":"A","e":""},{"set":"Set 1 – Mixed MCQs","n":33,"q":"Under Chapter VI (Payment of Dues, Claims and Audit) of Code on Wages, 2019, any application for claim may be filed to the ‘Authority’ by:","o":{"A":"The employee concerned","B":"Any Registered Trade Union","C":"The Inspector-cum-Facilitator","D":"Any of the above"},"a":"D","e":""},{"set":"Set 1 – Mixed MCQs","n":34,"q":"Under Chapter VI (Payment of Dues, Claims and Audit) of Code on Wages, 2019, any application for claim may be filed to the Authority within ____ from the date on which the claim arises.","o":{"A":"1 year","B":"2 years","C":"3 years","D":"6 months"},"a":"C","e":""},{"set":"Set 1 – Mixed MCQs","n":35,"q":"Any dispute with respect to fixation of bonus or eligibility for payment of bonus under Code on Wages, 2019 shall be deemed to be ____.","o":{"A":"A ‘trade dispute’ under the Trade Union Act, 1926","B":"An ‘industrial dispute’ under the Industrial Disputes Act, 1947","C":"Both A and B above","D":"Neither A nor B above"},"a":"B","e":""},{"set":"Set 1 – Mixed MCQs","n":36,"q":"Match the lists under Chapter VI (Payment of Dues, Claims and Audit). List I: (i) Once audit is done; (ii) During any proceedings before Authority, Appellate Authority, Tribunal or Arbitrator; (iii) The provisions of Records, Returns and Notices shall not apply. List II: (a) A corporation/company will not be required to prove accuracy of its audited balance sheet and profit and loss account; (b) where not more than 5 persons for agriculture or domestic purpose are employed by the employer; (c) the onus is not on the employers to prove the accuracy of accounts.","o":{"A":"(i) (ii) (iii): (b) (a) (c)","B":"(i) (ii) (iii): (c) (a) (b)","C":"(i) (ii) (iii): (c) (b) (a)","D":"(i) (ii) (iii): (b) (c) (a)"},"a":"B","e":""},{"set":"Set 1 – Mixed MCQs","n":37,"q":"Under Chapter VI (Payment of Dues, Claims and Audit) of Code on Wages, 2019, any aggrieved person can file an appeal against the order of the Authority to the ‘appellate authority’ within how many days?","o":{"A":"30 days","B":"45 days","C":"60 days","D":"90 days"},"a":"D","e":""},{"set":"Set 1 – Mixed MCQs","n":38,"q":"What is the time period available to the Appellate Authority to decide the appeal matter under the Code on Wages, 2019?","o":{"A":"1 month","B":"45 days","C":"3 months","D":"6 months"},"a":"C","e":""},{"set":"Set 1 – Mixed MCQs","n":39,"q":"Which authority has the power to appoint Inspector-cum-Facilitator under Chapter VII of Code on Wages, 2019?","o":{"A":"Central Government","B":"State Government","C":"Appropriate Government","D":"Labour Court"},"a":"C","e":""},{"set":"Set 1 – Mixed MCQs","n":40,"q":"Under Chapter VIII on offences and penalties of Code on Wages, 2019, no court shall take cognizance of any offence punishable under this Code, save on a complaint made by ____.","o":{"A":"An employee","B":"Registered Trade Union","C":"Inspector-cum-Facilitator","D":"All of the above"},"a":"D","e":""},{"set":"Set 1 – Mixed MCQs","n":41,"q":"For holding an inquiry and imposing penalty with respect to contravention of any provision of Code on Wages, 2019, the Appropriate Government is authorised to appoint an officer not below the rank of ____.","o":{"A":"Under Secretary to the Government of India","B":"Labour Commissioner","C":"Assistant Labour Commissioner","D":"No such provision is provided under the Code"},"a":"A","e":""},{"set":"Set 1 – Mixed MCQs","n":42,"q":"Under Chapter VIII on offences and penalties of Code on Wages, 2019, under ‘offences by companies’, ‘company’ means any body corporate and does not include ____.","o":{"A":"A firm","B":"An LLP","C":"A sole proprietor","D":"Association of Individuals"},"a":"C","e":""},{"set":"Set 1 – Mixed MCQs","n":43,"q":"Under Chapter VIII on offences and penalties of Code on Wages, 2019, any person who fails to comply with an order made by the Gazetted Officer shall be punishable with a sum equivalent to ____ of the maximum fine provided for the offence, in addition to such fine.","o":{"A":"20%","B":"30%","C":"40%","D":"50%"},"a":"A","e":""},{"set":"Set 1 – Mixed MCQs","n":44,"q":"Identify the incorrect statements and choose the correct option. (a) No court shall entertain any suit for recovery of minimum wages, any deduction from wages, discrimination in wages and payment of bonus claimed under Code on Wages, 2019. (b) No suit, prosecution or other legal proceeding shall lie against the appropriate Government or any officer for an act done in good faith. (c) Where a claim has been filed on account of non-payment of remuneration, the burden to prove that the dues have been paid shall be on the employee. (d) Any contract or agreement whereby an employee relinquishes the right to any amount or bonus due under this Code shall be null and void if it reduces liability to pay such amount. (e) Any amount deposited with the Appropriate Government by an employer to secure due performance of a contract shall be liable to attachment under any decree or order of any court in respect of any other debt.","o":{"A":"(a) and (b)","B":"(a), (c) and (e)","C":"(c), (d) and (e)","D":"(c) and (e)"},"a":"D","e":""},{"set":"Set 1 – Mixed MCQs","n":45,"q":"Which of the following Acts does not get repealed after the enforcement of Code on Wages, 2019?","o":{"A":"Payment of Wages Act, 1936","B":"Minimum Wages Act, 1948","C":"Payment of Bonus Act, 1965","D":"Payment of Gratuity Act, 1972"},"a":"D","e":""},{"set":"Set 1 – Mixed MCQs","n":46,"q":"As per provisions of the Code on Wages, 2019, ‘wages’ means all remuneration whether by way of salary, allowances or otherwise, and includes the following EXCEPT:","o":{"A":"Basic pay","B":"Dearness allowance","C":"Retaining allowance","D":"None of the above"},"a":"D","e":""},{"set":"Set 1 – Mixed MCQs","n":47,"q":"After introduction of Code on Wages, 2019, which of the following Acts are repealed? (i) Payment of Wages Act, 1936 (ii) Minimum Wages Act, 1948 (iii) Payment of Bonus Act, 1965 (iv) Equal Remuneration Act, 1976 (v) Industrial Disputes Act, 1947.","o":{"A":"(i), (iii), (iv), (v)","B":"(i), (ii), (iv), (v)","C":"(ii), (iii), (iv), (v)","D":"(i), (ii), (iii), (iv)"},"a":"D","e":""},{"set":"Set 1 – Mixed MCQs","n":48,"q":"As per provisions of the Code on Wages, 2019, the ‘Tribunal’ shall have the same meaning as assigned to it in the:","o":{"A":"Industrial Disputes Act, 1947","B":"Minimum Wages Act, 1948","C":"Payment of Bonus Act, 1965","D":"Equal Remuneration Act, 1976"},"a":"A","e":""},{"set":"Set 1 – Mixed MCQs","n":49,"q":"As per provisions of the Code on Wages, 2019, the time limit for payment of wages in case of a fortnightly wage period is:","o":{"A":"Before the end of the 2nd day after the fortnight","B":"Before the end of the 3rd day after the fortnight","C":"Before the end of the 5th day after the fortnight","D":"Before the end of the 7th day after the fortnight"},"a":"A","e":""},{"set":"Set 1 – Mixed MCQs","n":50,"q":"As per provisions of the Code on Wages, 2019, the Central Government shall constitute the Central Advisory Board, which shall have ____ representatives of such State Governments as may be nominated by the Central Government.","o":{"A":"3","B":"8","C":"10","D":"None of the above"},"a":"D","e":""},{"set":"Set 2 – Scenario Based","n":1,"q":"An employer pays a worker less than the minimum wage fixed by the appropriate Government. Which statement is correct?","o":{"A":"The employer may pay less if the worker agrees.","B":"The employer may pay less during a period of low business profits.","C":"The employer cannot pay less than the prescribed minimum wage.","D":"The employer may pay less if the worker is employed in the unorganised sector."},"a":"C","e":"The Code protects employees against payment below the applicable minimum wage. An employee's consent or the employer's financial difficulties do not, by themselves, authorise payment below the statutory minimum. The Code extends minimum- wage protection across employments rather than limiting it to specified scheduled employments."},{"set":"Set 2 – Scenario Based","n":2,"q":"The Central Government fixes a floor wage of ₹500 per day. A State Government has already fixed the minimum wage at ₹600 per day. What is the correct position?","o":{"A":"The State must reduce the minimum wage to ₹500.","B":"The State may reduce the minimum wage to ₹450.","C":"The State cannot reduce its existing minimum wage merely because it exceeds the floor wage.","D":"The Central Government must pay the additional ₹100 to every worker."},"a":"C","e":"The floor wage acts as a baseline, not a maximum limit. A State can fix a higher minimum wage, and an existing minimum wage above the floor wage cannot be reduced on that ground alone."},{"set":"Set 2 – Scenario Based","n":3,"q":"Which of the following factors may be considered while fixing minimum wages?","o":{"A":"Skill required for the work","B":"Geographical area","C":"Difficult or hazardous working conditions","D":"All of the above"},"a":"D","e":"Minimum wages may vary according to skill levels, geographical areas and the arduousness of work, including difficult or hazardous conditions. The purpose is to account for relevant differences in employment conditions rather than impose one identical rate for every job."},{"set":"Set 2 – Scenario Based","n":4,"q":"A worker is paid according to the number of units produced. Which statement best describes the protection available under the Code?","o":{"A":"The worker is never entitled to minimum-wage protection.","B":"The worker must be paid only if a production target is achieved.","C":"A minimum wage rate can be fixed for piece work, with a time- work-based minimum rate to protect the worker.","D":"The employer may decide the minimum wage without any legal restrictions."},"a":"C","e":"Piece-rate payment depends on the quantity produced. The Code provides for minimum rates for piece work and a minimum time rate to safeguard workers against earnings falling below the prescribed protection."},{"set":"Set 2 – Scenario Based","n":5,"q":"A worker is willing to accept wages below the applicable statutory minimum because they urgently need employment. Is the employer thereby permitted to pay less?","o":{"A":"Yes, because the worker has voluntarily agreed.","B":"Yes, if the agreement is in writing.","C":"No, the worker's agreement does not remove the employer's statutory obligation.","D":"Yes, provided the employer is a small business."},"a":"C","e":"Minimum-wage requirements are statutory protections. A private agreement cannot ordinarily be used to avoid the obligation to pay the prescribed minimum wage."},{"set":"Set 2 – Scenario Based","n":6,"q":"A factory pays male and female employees different wages for work requiring the same skill, effort, experience and responsibility under similar working conditions. Which statement is correct?","o":{"A":"Different wages are always permitted if the employer prefers one category of workers.","B":"Gender-based wage discrimination is prohibited for the same work or work of a similar nature.","C":"Equal wages are required only in government employment.","D":"The employer can discriminate if both employees have signed their contracts."},"a":"B","e":"The Code prohibits discrimination on the ground of gender in wages for the same work or work of a similar nature. The comparison considers factors such as skill, effort, experience and responsibility under similar working conditions."},{"set":"Set 2 – Scenario Based","n":7,"q":"An employee's normal hourly wage is ₹150. The employee works overtime for 3 hours. What is the minimum overtime payment for those 3 hours?","o":{"A":"₹450","B":"₹600","C":"₹750","D":"₹900"},"a":"D","e":"Overtime wages must be at least twice the normal rate. •   Normal hourly wage = ₹150 •   Minimum overtime rate = ₹150 × 2 = ₹300 •   Payment for 3 hours = ₹300 × 3 = ₹900"},{"set":"Set 2 – Scenario Based","n":8,"q":"An employer argues that overtime can be paid at the normal rate because the employee voluntarily agreed to work extra hours. Which statement is correct?","o":{"A":"The normal rate is sufficient in every case.","B":"The overtime rate must be at least twice the normal rate of wages.","C":"Overtime payment is entirely optional.","D":"Overtime is payable only to government employees."},"a":"B","e":"The Code prescribes a minimum overtime rate of twice the normal rate of wages for work beyond the normal working day. An employee's willingness to work overtime does not, by itself, remove this statutory requirement."},{"set":"Set 2 – Scenario Based","n":9,"q":"Which of the following is NOT a recognised wage period under the Code?","o":{"A":"Daily","B":"Weekly","C":"Fortnightly","D":"Quarterly"},"a":"D","e":"The recognised wage periods are daily, weekly, fortnightly and monthly. The wage period cannot exceed one month."},{"set":"Set 2 – Scenario Based","n":10,"q":"An employee receives monthly wages. By when must the wages generally be paid for the preceding month?","o":{"A":"Before the end of the third day of the succeeding month","B":"Before the end of the fifth day of the succeeding month","C":"Before the end of the seventh day of the succeeding month","D":"Before the end of the fifteenth day of the succeeding month"},"a":"C","e":"For a monthly wage period, wages must generally be paid before the expiry of the seventh day of the succeeding month. Special rules apply to certain circumstances, including termination of employment."},{"set":"Set 2 – Scenario Based","n":11,"q":"An employee earns ₹24,000 during a wage period. What is the maximum total deduction generally permitted under the Code's 50% limit?","o":{"A":"₹6,000","B":"₹10,000","C":"₹12,000","D":"₹18,000"},"a":"C","e":"The total deductions generally cannot exceed 50% of wages. Calculation: ₹24,000 × 50% = ₹12,000. This limit does not mean that an employer can deduct any amount for any reason. Each deduction must be legally authorised."},{"set":"Set 2 – Scenario Based","n":12,"q":"An employee accidentally damages equipment belonging to the employer. Can the employer automatically deduct the full replacement cost from the employee's wages?","o":{"A":"Yes, every workplace loss can be deducted automatically.","B":"Yes, even if the employee was not responsible.","C":"No, deductions for damage or loss must satisfy the prescribed legal conditions and cannot be arbitrary.","D":"No deduction is ever permitted for damage or loss."},"a":"C","e":"A deduction for damage or loss must relate to goods or money expressly entrusted to the employee, and the loss must be directly attributable to the employee's neglect or default. The deduction cannot exceed the amount of the actual loss, and the employee must be given an opportunity to explain the circumstances."},{"set":"Set 2 – Scenario Based","n":13,"q":"An employer wants to impose a fine on an employee for alleged misconduct. Which statement is correct?","o":{"A":"Any fine can be imposed without informing the employee.","B":"Fines are permitted only in accordance with the Code's prescribed conditions and procedures.","C":"The employer may deduct the entire monthly salary as a fine.","D":"Fines are always prohibited under the Code."},"a":"B","e":"Fines are subject to statutory safeguards. They can be imposed only for approved acts or omissions and in accordance with the prescribed procedure and limits. An employer cannot arbitrarily impose fines or use them to confiscate an employee's wages."},{"set":"Set 2 – Scenario Based","n":14,"q":"Which of the following is an authorised mode of payment of wages under the Code?","o":{"A":"Currency notes or coins","B":"Cheque","C":"Bank transfer or electronic mode","D":"All of the above"},"a":"D","e":"The Code recognises payment in coins or currency notes, by cheque, by crediting the employee's bank account, or through electronic mode, subject to applicable requirements."},{"set":"Set 2 – Scenario Based","n":15,"q":"An employee has worked for 45 days during an accounting year and satisfies the applicable wage-ceiling and other statutory conditions. Is the employee eligible for consideration for annual bonus?","o":{"A":"No, because an employee must work for at least 90 days.","B":"No, because only permanent employees qualify.","C":"Yes, because the minimum service requirement is 30 days, subject to the other eligibility conditions.","D":"Yes, regardless of the applicable wage ceiling or other conditions."},"a":"C","e":"An employee must have worked for at least 30 days in the accounting year and satisfy the other statutory eligibility conditions, including the applicable wage ceiling. Completing 30 days alone does not guarantee eligibility in every circumstance."},{"set":"Set 2 – Scenario Based","n":16,"q":"What is the minimum annual bonus rate generally prescribed for an eligible employee under the Code?","o":{"A":"5% of wages earned or ₹100, whichever is higher","B":"8⅓% of wages earned or ₹100, whichever is higher","C":"12% of wages earned or ₹500, whichever is higher","D":"20% of wages earned in every case"},"a":"B","e":"The Code prescribes a minimum annual bonus of 8⅓% of wages earned or ₹100, whichever is higher, for eligible employees. Eligibility depends on the applicable wage ceiling and other statutory conditions."},{"set":"Set 2 – Scenario Based","n":17,"q":"An eligible employee earns ₹1,20,000 in wages during the accounting year. Assuming the statutory minimum-bonus calculation applies to the full amount, what is the minimum bonus at 8⅓%?","o":{"A":"₹8,000","B":"₹9,000","C":"₹10,000","D":"₹12,000"},"a":"C","e":"The minimum bonus rate is 8⅓%, equivalent to one- twelfth. Calculation: ₹1,20,000 ÷ 12 = ₹10,000. This calculation assumes the employee is eligible and the full stated amount is the applicable wage base for the calculation."},{"set":"Set 2 – Scenario Based","n":18,"q":"What is the maximum annual bonus rate generally payable under the Code when the allocable surplus supports it?","o":{"A":"8⅓%","B":"12%","C":"15%","D":"20%"},"a":"D","e":"The minimum bonus is generally 8⅓%, while the maximum bonus can reach 20% of the relevant wages when supported by the allocable surplus and subject to the Code's provisions. The maximum rate is not automatically payable to every employee."},{"set":"Set 2 – Scenario Based","n":19,"q":"Which of the following may disqualify an employee from receiving a bonus under the Code?","o":{"A":"Taking authorised leave","B":"Requesting payment of minimum wages","C":"Dismissal for specified misconduct, such as theft or fraud","D":"Completing the assigned work before the deadline"},"a":"C","e":"The Code provides for disqualification from bonus in specified cases, including dismissal for fraud, theft, misappropriation or sabotage of the establishment's property, riotous or violent behaviour on its premises, and conviction for sexual harassment. Ordinary authorised leave or requesting lawful wages is not, by itself, such a ground."},{"set":"Set 2 – Scenario Based","n":20,"q":"An employer argues that the minimum-wage provisions do not apply to an employee because the establishment belongs to the unorganised sector. Which statement is correct?","o":{"A":"The employer is correct because only organised-sector employees are protected.","B":"The employer is correct if the employee is paid daily wages.","C":"The employer is incorrect because minimum-wage protection extends across organised and unorganised employments covered by the Code.","D":"The employer is correct unless the employee belongs to a trade union."},"a":"C","e":"The Code expanded minimum-wage protection beyond the earlier system of scheduled employments. The unorganised nature of an establishment or the fact that an employee receives daily wages does not, by itself, exclude the employee from minimum- wage protection. Quick Revision Table Topic                          Important fact to remember Earlier Central laws 4 consolidated Floor wage                     Fixed by Central Government Existing minimum wage above Cannot be reduced merely because floor wage                  of the floor wage Overtime                       At least twice the normal rate Wage period                    Daily, weekly, fortnightly or monthly Generally before the 7th day of the Monthly wage payment succeeding month Maximum total wage Generally 50% deductions"},{"set":"Set 3 – Calculation & Scenario","n":1,"q":"Which of the following payments is expressly included in the definition of wages under the Code on Wages, 2019?","o":{"A":"House rent allowance","B":"Basic pay","C":"Employer's contribution to the provident fund","D":"Conveyance allowance"},"a":"B","e":"The definition of wages expressly includes basic pay, dearness allowance and retaining allowance, if any. Several other payments are excluded, subject to the statutory proviso concerning the treatment of excluded components when they exceed the prescribed proportion of remuneration."},{"set":"Set 3 – Calculation & Scenario","n":2,"q":"An employee receives the following monthly remuneration: •   Basic pay: ₹15,000 •   Dearness allowance: ₹3,000 •   House rent allowance: ₹5,000 •   Other excluded allowances: ₹7,000 Which statement is correct regarding the definition of wages?","o":{"A":"Only basic pay is included in wages in every circumstance.","B":"Basic pay and dearness allowance are included, and the statutory rules concerning excluded components must also be considered.","C":"All allowances are automatically included in wages.","D":"House rent allowance is always included in full, irrespective of the statutory definition."},"a":"B","e":"Basic pay and dearness allowance are expressly included. Under the definition of wages, specified excluded components exceeding one-half of all remuneration, or such other percentage as may be notified by the Central Government, are added back to wages. Therefore, exclusions must be evaluated under the complete statutory definition rather than treated as unlimited."},{"set":"Set 3 – Calculation & Scenario","n":3,"q":"The Central Government fixes different floor wages for different geographical areas. Is this permissible?","o":{"A":"No, only one uniform floor wage is permitted throughout India.","B":"Yes, different floor wages may be fixed for different geographical areas.","C":"Yes, but only with the approval of every State Legislature.","D":"No, because only State Governments can fix floor wages."},"a":"B","e":"The Central Government may fix different floor wages for different geographical areas, taking into account the minimum living standards of workers. The floor wage provides a baseline for minimum wages fixed by the appropriate Government."},{"set":"Set 3 – Calculation & Scenario","n":4,"q":"A worker is paid on a piece-rate basis. Due to low production, the worker's earnings fall below the applicable time-rate minimum wage. Which statement is most appropriate?","o":{"A":"The employer has no responsibility because payment is based on production.","B":"Minimum-wage protection can apply even when the worker is paid on a piece-rate basis.","C":"Piece-rate workers are excluded from the Code.","D":"The worker must accept whatever amount the employer calculates."},"a":"B","e":"The Code provides for minimum wages for time work and piece work. The time-rate minimum provides protection to piece-rate workers so that the payment arrangement does not defeat minimum-wage safeguards."},{"set":"Set 3 – Calculation & Scenario","n":5,"q":"An employer pays the prescribed minimum wage but refuses to pay the overtime rate for additional hours worked. Which statement is correct?","o":{"A":"Payment of minimum wages automatically includes all overtime.","B":"Overtime wages are not required if the employee is already receiving minimum wages.","C":"The employer must comply separately with the applicable overtime-wage requirement.","D":"Overtime wages are payable only when the employee works on a Sunday."},"a":"C","e":"Minimum wages and overtime wages serve different purposes. Payment of the minimum wage does not automatically discharge the employer's obligation to pay the prescribed overtime rate when the relevant conditions are satisfied."},{"set":"Set 3 – Calculation & Scenario","n":6,"q":"An employer fixes a wage period of two months for its employees. Is this permissible under the Code?","o":{"A":"Yes, if the employees agree.","B":"Yes, if the establishment is privately owned.","C":"No, a wage period cannot exceed one month.","D":"No, because wages must always be paid daily."},"a":"C","e":"The Code permits daily, weekly, fortnightly and monthly wage periods. A wage period cannot exceed one month, ensuring that employees receive wages within the prescribed intervals."},{"set":"Set 3 – Calculation & Scenario","n":7,"q":"An employee is dismissed from service. When must the wages payable on dismissal generally be paid?","o":{"A":"Within two working days","B":"Within seven days","C":"Within fifteen days","D":"At the end of the next accounting year"},"a":"A","e":"Under the Code, wages payable following removal, dismissal, retrenchment, resignation or unemployment due to closure are generally required to be paid within two working days, subject to the applicable statutory provisions and rules."},{"set":"Set 3 – Calculation & Scenario","n":8,"q":"An employer makes total deductions of ₹18,000 from an employee's wages of ₹30,000 during a wage period. Which statement is correct?","o":{"A":"The deductions are within the general limit because they are below 75%.","B":"The deductions exceed the general statutory limit of 50%.","C":"The deductions are automatically valid if the employee signs a consent form.","D":"The deductions are valid because the employer determines the amount."},"a":"B","e":"The general ceiling is 50% of wages for the wage period. Calculation: ₹30,000 × 50% = ₹15,000. The proposed deduction of ₹18,000 exceeds this limit by ₹3,000. The fact that an employee has consented does not automatically validate deductions that violate the Code."},{"set":"Set 3 – Calculation & Scenario","n":9,"q":"Which of the following may legally justify a deduction from an employee's wages, provided the statutory conditions are satisfied?","o":{"A":"A deduction for an employee's absence from duty","B":"A deduction because the employer dislikes the employee","C":"A deduction for refusing an unlawful instruction","D":"A deduction imposed without any legal authority"},"a":"A","e":"The Code recognises certain authorised deductions, including deductions for absence from duty, subject to prescribed conditions. Employers cannot make arbitrary deductions merely because they are dissatisfied with an employee."},{"set":"Set 3 – Calculation & Scenario","n":10,"q":"An employee is absent for only part of the working day. Can the employer deduct wages for the entire day in every case?","o":{"A":"Yes, every partial absence results in a full-day deduction.","B":"No, deductions for absence must comply with the applicable statutory rules and limits.","C":"Yes, if the employee is a private-sector worker.","D":"No deduction is ever permitted for partial absence."},"a":"B","e":"Deductions for absence are governed by statutory conditions. The amount deducted must be proportionate to the relevant period of absence, subject to the Code's provisions and applicable rules. A full-day deduction cannot be imposed arbitrarily for every partial absence."},{"set":"Set 3 – Calculation & Scenario","n":11,"q":"A company pays a male employee ₹900 per day and a female employee ₹800 per day for the same work under similar working conditions. No relevant legal exception applies. What is the correct position?","o":{"A":"The difference is permissible because the employer determines wages.","B":"The difference is permissible if the company is privately owned.","C":"Gender-based wage discrimination is prohibited.","D":"Equal wages apply only to employees working in government departments."},"a":"C","e":"The Code prohibits gender-based discrimination in wages for the same work or work of a similar nature. The employer cannot justify a wage difference merely by relying on its own preference."},{"set":"Set 3 – Calculation & Scenario","n":12,"q":"An employee's normal hourly wage is ₹180. The employee works overtime for 4 hours. What is the minimum overtime payment?","o":{"A":"₹360","B":"₹540","C":"₹720","D":"₹1,440"},"a":"D","e":"The minimum overtime rate is twice the normal rate. •   Normal hourly wage = ₹180 •   Overtime rate = ₹180 × 2 = ₹360 •   Payment for 4 hours = ₹360 × 4 = ₹1,440"},{"set":"Set 3 – Calculation & Scenario","n":13,"q":"An employer pays overtime at 1.5 times the normal wage rate. The normal hourly wage is ₹200. What is the correct conclusion?","o":{"A":"The overtime rate is sufficient because it exceeds the normal wage.","B":"The overtime rate is below the statutory minimum of twice the normal rate.","C":"The overtime rate is valid whenever the employee agrees.","D":"The Code does not prescribe an overtime rate."},"a":"B","e":"Twice the normal hourly wage of ₹200 is ₹400. An overtime rate of ₹300 is therefore insufficient under the general requirement of the Code."},{"set":"Set 3 – Calculation & Scenario","n":14,"q":"An employee has worked for 25 days during an accounting year. The employee otherwise satisfies the applicable wage-ceiling conditions. Does the employee satisfy the minimum service requirement for annual bonus?","o":{"A":"Yes, because any period of employment is sufficient.","B":"Yes, because 15 days is the minimum requirement.","C":"No, because the minimum service requirement is 30 days.","D":"No, because the minimum service requirement is 90 days."},"a":"C","e":"The employee must have worked for at least 30 days in the accounting year to meet the minimum service requirement. Satisfying the wage-ceiling condition alone is not enough."},{"set":"Set 3 – Calculation & Scenario","n":15,"q":"An eligible employee earns ₹96,000 in wages during the accounting year. Assuming the full amount is the applicable wage base, what is the minimum bonus at 8⅓%?","o":{"A":"₹6,000","B":"₹8,000","C":"₹9,600","D":"₹19,200"},"a":"B","e":"The minimum bonus rate of 8⅓% is equivalent to one- twelfth. ₹96,000 ÷ 12 = ₹8,000. This calculation assumes that the employee satisfies the statutory eligibility requirements and that the stated amount is the applicable wage base."},{"set":"Set 3 – Calculation & Scenario","n":16,"q":"An employee earns ₹1,50,000 in applicable wages during the accounting year. If a bonus of 20% is payable under the applicable provisions, what is the bonus amount?","o":{"A":"₹12,500","B":"₹15,000","C":"₹20,000","D":"₹30,000"},"a":"D","e":"Bonus at 20% is calculated as: ₹1,50,000 × 20% = ₹30,000. The 20% rate is the maximum annual bonus rate, not an automatic entitlement for every employee."},{"set":"Set 3 – Calculation & Scenario","n":17,"q":"An employee is dismissed for theft involving the employer's property. What may be the consequence under the bonus provisions?","o":{"A":"The employee must always receive the full bonus.","B":"The employee may be disqualified from receiving a bonus under the statutory provisions.","C":"The employee automatically receives double bonus.","D":"The dismissal has no relevance to bonus eligibility."},"a":"B","e":"Dismissal for specified misconduct, including theft, misappropriation or sabotage of the establishment's property, may disqualify an employee from receiving a bonus. The statutory grounds must be satisfied."},{"set":"Set 3 – Calculation & Scenario","n":18,"q":"A company employs workers in both organised and unorganised forms of employment. Which statement best reflects the Code's minimum-wage framework?","o":{"A":"Only workers in registered factories can receive minimum-wage protection.","B":"Only permanent workers can receive minimum-wage protection.","C":"Minimum-wage protection extends across employments covered by the Code, subject to its provisions.","D":"Minimum-wage protection applies only to workers who belong to trade unions."},"a":"C","e":"The Code broadened minimum-wage protection beyond the earlier framework of scheduled employments. Workers are not excluded merely because an establishment is unorganised or because they are not members of a trade union."},{"set":"Set 3 – Calculation & Scenario","n":19,"q":"An employer maintains no records of wages paid to employees. Which statement is most appropriate?","o":{"A":"Maintaining wage records is never required.","B":"The employer must comply with the applicable record- maintenance and reporting requirements.","C":"Only employees are responsible for maintaining wage records.","D":"Wage records are required only when a court orders them."},"a":"B","e":"Employers must comply with the record-keeping, register, notice and related requirements prescribed under the Code and applicable rules. These records support verification of wage payments and statutory compliance."},{"set":"Set 3 – Calculation & Scenario","n":20,"q":"An employer violates the Code by paying wages below the applicable minimum wage. Which statement is correct?","o":{"A":"No penalty can be imposed if the employee continues working.","B":"The employer is automatically exempt if the employee does not complain.","C":"The employer may face statutory penalties for the violation.","D":"The employee alone is responsible for correcting the wage rate."},"a":"C","e":"The Code provides for penalties for specified contraventions, including payment of wages below the applicable minimum wage. The consequences depend on the nature of the violation and the applicable statutory provisions. Quick Revision — Set 2 Topic                      Key fact Includes basic pay, dearness allowance Definition of wages and retaining allowance Excluded wage              Subject to the statutory 50% rule or components                 another notified percentage Wage period                Cannot exceed one month Wages after dismissal or Generally payable within two working resignation              days Total wage deductions      Generally capped at 50% Overtime                   At least twice the normal rate Bonus service At least 30 days in the accounting year requirement Minimum bonus   8⅓% or ₹100, whichever is higher Maximum bonus   20%, subject to statutory conditions Must comply with applicable legal Wage records requirements"},{"set":"Set 4 – 100 Important MCQs","n":1,"q":"The Code on Wages, 2019 extends to:","o":{"A":"Selected States only","B":"The whole of India","C":"India excluding Union Territories","D":"Only Central Government establishments"},"a":"B","e":"Section 1 provides for the Code's extension to the whole of India."},{"set":"Set 4 – 100 Important MCQs","n":2,"q":"Under Section 1(3), the Code comes into force on:","o":{"A":"The date of Presidential assent in every case","B":"A date notified by the Central Government in the Official Gazette","C":"A date notified separately by every employer","D":"The date of its introduction in Parliament"},"a":"B","e":"Different provisions may be brought into force on different dates."},{"set":"Set 4 – 100 Important MCQs","n":3,"q":"What is the accounting year under the Code on Wages?","o":{"A":"1 January to 31 December","B":"1 April to 31 March","C":"1 July to 30 June","D":"1 October to 30 September"},"a":"B","e":"The accounting year begins on 1 April and ends on 31 March."},{"set":"Set 4 – 100 Important MCQs","n":4,"q":"Which establishment falls under the Central Government as the appropriate Government, according to the categories covered in the Code?","o":{"A":"Every neighbourhood retail shop","B":"Every privately owned restaurant","C":"A banking company","D":"Every local grocery store"},"a":"C","e":"Banking companies are among the specified categories for which the Central Government is the appropriate Government."},{"set":"Set 4 – 100 Important MCQs","n":5,"q":"Which of the following is excluded from the definition of an employee under the Code on Wages?","o":{"A":"A clerical employee","B":"A technical employee","C":"A manager","D":"An apprentice engaged under the Apprentices Act, 1961"},"a":"D","e":"The definition of employee is broad but excludes apprentices engaged under the Apprentices Act, 1961."},{"set":"Set 4 – 100 Important MCQs","n":6,"q":"Which of the following may be included within the definition of an employee?","o":{"A":"Only manual workers","B":"Only workers employed in factories","C":"Managerial and administrative employees","D":"Only employees receiving minimum wages"},"a":"C","e":"The definition of employee includes persons employed in managerial, administrative, technical, clerical and other specified capacities."},{"set":"Set 4 – 100 Important MCQs","n":7,"q":"Which statement correctly describes a contractor under the Code?","o":{"A":"A contractor can only supply manufactured goods.","B":"A contractor may undertake a specified result through contract labour or supply contract labour.","C":"A contractor can never include a subcontractor.","D":"A contractor must be a government department."},"a":"B","e":"The definition covers specified work through contract labour, labour supply and subcontractors. Mere supply of goods, by itself, is excluded."},{"set":"Set 4 – 100 Important MCQs","n":8,"q":"Which of the following is generally excluded from the definition of contract labour under the stated conditions?","o":{"A":"A worker hired through a contractor for work connected with an establishment","B":"An inter-State migrant worker engaged through a contractor","C":"A worker employed by a contractor for the establishment's work","D":"A worker regularly employed by the contractor in its own establishment under mutually accepted employment conditions with the specified benefits"},"a":"D","e":"Regular employment in the contractor's own establishment, with the prescribed employment conditions and benefits, falls within the stated exclusion."},{"set":"Set 4 – 100 Important MCQs","n":9,"q":"Which statement correctly defines an establishment under the Code on Wages?","o":{"A":"A place where only government work is carried out","B":"A place where only manufacturing occurs","C":"A place where industry, trade, business, manufacture or occupation is carried on","D":"Only a factory registered under the Factories Act"},"a":"C","e":"The definition covers the specified range of economic and occupational activities."},{"set":"Set 4 – 100 Important MCQs","n":10,"q":"For determining whether two jobs involve the same work or work of a similar nature, which factors are relevant?","o":{"A":"Skill alone","B":"Salary alone","C":"Designation alone","D":"Skill, effort, experience, responsibility and similar working conditions"},"a":"D","e":"The comparison considers the nature and conditions of work, not merely job titles."},{"set":"Set 4 – 100 Important MCQs","n":11,"q":"Which combination correctly represents the basic components of wages under the definition discussed in the Code?","o":{"A":"House Rent Allowance, commission and gratuity","B":"Basic pay, dearness allowance and retaining allowance","C":"Bonus, pension and overtime allowance","D":"Gratuity, employer's PF contribution and commission"},"a":"B","e":"Remember BDR — Basic pay, Dearness allowance and Retaining allowance."},{"set":"Set 4 – 100 Important MCQs","n":12,"q":"If excluded components covered by the statutory wage definition exceed 50% of total remuneration, what happens?","o":{"A":"The entire remuneration is excluded from wages.","B":"All excluded components are ignored without exception.","C":"The amount exceeding the 50% limit is added back to wages.","D":"Only the employer's contribution to PF is added back."},"a":"C","e":"For example, if total remuneration is ₹40,000 and the relevant excluded components are ₹25,000, the excess over ₹20,000 is ₹5,000 and is added back."},{"set":"Set 4 – 100 Important MCQs","n":13,"q":"What is the maximum proportion of remuneration in kind that may be taken into account under the stated wage-computation rule?","o":{"A":"5%","B":"10%","C":"15%","D":"50%"},"a":"C","e":"The value of remuneration in kind included under this rule cannot exceed 15% of the total wages payable."},{"set":"Set 4 – 100 Important MCQs","n":14,"q":"Which of the following is included in the definition of worker discussed in the Code?","o":{"A":"Every member of the Armed Forces","B":"Working journalists","C":"Every person employed mainly in a managerial capacity","D":"Every person employed mainly in an administrative capacity"},"a":"B","e":"Working journalists and sales promotion employees are among the specified inclusions, subject to the statutory definition and exclusions."},{"set":"Set 4 – 100 Important MCQs","n":15,"q":"Under the definition discussed, a supervisory employee earning more than which monthly amount falls within the stated exclusion, subject to the applicable statutory provision?","o":{"A":"₹10,000","B":"₹12,000","C":"₹15,000","D":"₹25,000"},"a":"C","e":"The stated supervisory wage threshold is ₹15,000 per month, subject to the applicable statutory provisions or notification."},{"set":"Set 4 – 100 Important MCQs","n":16,"q":"An employer pays ₹450 per day when the notified minimum wage for the worker's category is ₹550 per day. Which statement is correct?","o":{"A":"The payment is valid if the worker agrees.","B":"The payment is valid if the employer suffers a loss.","C":"The payment violates the minimum wage requirement.","D":"The payment is valid for every piece-rate worker."},"a":"C","e":"An employer cannot ordinarily pay below the applicable statutory minimum wage merely because the worker agrees."},{"set":"Set 4 – 100 Important MCQs","n":17,"q":"Who fixes minimum wages under Section 6?","o":{"A":"The employer alone","B":"The appropriate Government","C":"The employee's trade union alone","D":"The Labour Court in every case"},"a":"B","e":"The appropriate Government fixes minimum wage rates in accordance with the Code."},{"set":"Set 4 – 100 Important MCQs","n":18,"q":"Which of the following is an example of time work?","o":{"A":"₹10 for every item produced","B":"₹20 for every kilogram manufactured","C":"₹100 for every hour worked","D":"₹50 for every unit packed"},"a":"C","e":"In time work, wages are linked to time worked, such as an hour, day or month."},{"set":"Set 4 – 100 Important MCQs","n":19,"q":"Which of the following is an example of piece work?","o":{"A":"₹100 per hour","B":"₹700 per day","C":"₹20,000 per month","D":"₹10 for every unit produced"},"a":"D","e":"Piece-rate wages are calculated according to the number of units produced or completed."},{"set":"Set 4 – 100 Important MCQs","n":20,"q":"Which factor may be considered when fixing minimum wages?","o":{"A":"The employer's personal preferences","B":"The worker's political opinions","C":"Skill level and geographical area","D":"The employer's preferred profit margin alone"},"a":"C","e":"Skill, geographical area and difficult or hazardous working conditions may be considered."},{"set":"Set 4 – 100 Important MCQs","n":21,"q":"Which of the following is NOT one of the specified skill categories used in wage fixation?","o":{"A":"Unskilled","B":"Semi-skilled","C":"Skilled","D":"Professionally certified"},"a":"D","e":"The categories listed include unskilled, semi-skilled, skilled and highly skilled."},{"set":"Set 4 – 100 Important MCQs","n":22,"q":"Which statement about the number of different minimum wage rates is correct?","o":{"A":"It should be as large as possible.","B":"It should equal the number of employers.","C":"It should be kept to a minimum as far as possible.","D":"It must be identical in every geographical area."},"a":"C","e":"The Code's stated approach is to keep the number of different minimum wage rates to a minimum, as far as possible."},{"set":"Set 4 – 100 Important MCQs","n":23,"q":"Which component may form part of minimum wages under Section 7?","o":{"A":"Cost of Living Allowance","B":"Employer's entire annual profit","C":"Employee's personal savings","D":"Dividend paid to shareholders"},"a":"A","e":"Minimum wages may include basic wage, Cost of Living Allowance and the cash value of concessions on essential commodities."},{"set":"Set 4 – 100 Important MCQs","n":24,"q":"Cost of Living Allowance is adjusted according to changes in:","o":{"A":"The employer's profit","B":"The cost of living index","C":"The company's share price","D":"The employee's designation"},"a":"B","e":"The allowance reflects changes in the cost of living index."},{"set":"Set 4 – 100 Important MCQs","n":25,"q":"Under the committee method for fixing or revising minimum wages, employer and employee representatives must be:","o":{"A":"Unequal in number","B":"Equal in number","C":"Selected exclusively from government departments","D":"Replaced entirely by independent persons"},"a":"B","e":"Employer and employee representatives must have equal representation on the committee."},{"set":"Set 4 – 100 Important MCQs","n":26,"q":"Independent persons on the minimum-wage committee must not exceed:","o":{"A":"One-fourth of the total members","B":"One-third of the total members","C":"One-half of the total members","D":"Two-thirds of the total members"},"a":"B","e":"The maximum permitted proportion of independent persons is one-third."},{"set":"Set 4 – 100 Important MCQs","n":27,"q":"Under the notification method, the period allowed for representations must be at least:","o":{"A":"15 days","B":"One month","C":"Two months","D":"Six months"},"a":"C","e":"The notification must specify a date at least two months from its issuance for consideration of representations."},{"set":"Set 4 – 100 Important MCQs","n":28,"q":"Under the procedure described for fixing or revising minimum wages, the notification normally comes into force after:","o":{"A":"15 days","B":"One month","C":"Two months","D":"Three months"},"a":"D","e":"The general period stated for the notification to come into force is three months, subject to the applicable provision."},{"set":"Set 4 – 100 Important MCQs","n":29,"q":"Minimum wage rates should ordinarily be reviewed or revised at intervals not exceeding:","o":{"A":"Two years","B":"Three years","C":"Five years","D":"Ten years"},"a":"C","e":"The stated maximum interval for review or revision is five years."},{"set":"Set 4 – 100 Important MCQs","n":30,"q":"Who determines the national floor wage under Section 9?","o":{"A":"Every employer individually","B":"The Central Government","C":"Every trade union individually","D":"The State Government without reference to the Central Government"},"a":"B","e":"The Central Government fixes the floor wage. Minimum wages fixed by the appropriate Government cannot be below the applicable floor wage."},{"set":"Set 4 – 100 Important MCQs","n":31,"q":"A State has fixed a minimum wage of ₹600 per day. The applicable floor wage is ₹650 per day. Which statement follows from the stated rule?","o":{"A":"The minimum wage may remain ₹600 in every case.","B":"The minimum wage cannot be below the applicable floor wage.","C":"The floor wage must be reduced to ₹600.","D":"The employer may select either amount."},"a":"B","e":"The minimum wage must not fall below the applicable floor wage."},{"set":"Set 4 – 100 Important MCQs","n":32,"q":"An employee is ready and willing to work for the full day, but the employer fails to provide work. Under the stated short-working- day rule, the employee is generally entitled to:","o":{"A":"No wages","B":"Half-day wages in every case","C":"The full day's wages, subject to the statutory conditions","D":"Only overtime wages"},"a":"C","e":"The protection applies where the employee is ready and willing to work but the employer fails to provide work, subject to the Code's conditions and exceptions."},{"set":"Set 4 – 100 Important MCQs","n":33,"q":"A worker is employed on a piece-rate basis, but a minimum time rate has been prescribed for the relevant category. What must the employer ensure?","o":{"A":"The worker may always be paid below the minimum time rate.","B":"Minimum wages do not apply to piece-rate workers.","C":"The worker receives at least the applicable minimum time rate.","D":"The employer may disregard the prescribed rate."},"a":"C","e":"Piece-rate payment does not remove the protection of the applicable minimum time rate."},{"set":"Set 4 – 100 Important MCQs","n":34,"q":"Under the weekly-rest rule described in the study material, a worker is generally entitled to a rest day in every:","o":{"A":"Three-day period","B":"Five-day period","C":"Seven-day period","D":"Ten-day period"},"a":"C","e":"The stated rule provides for one weekly rest day in every seven-day period, subject to the applicable provisions."},{"set":"Set 4 – 100 Important MCQs","n":35,"q":"The minimum overtime rate specified in the study material is:","o":{"A":"Equal to the ordinary rate","B":"1.25 times the ordinary rate","C":"1.5 times the ordinary rate","D":"At least twice the ordinary rate"},"a":"D","e":"Overtime wages are payable at not less than twice the normal rate, subject to the applicable statutory conditions."},{"set":"Set 4 – 100 Important MCQs","n":36,"q":"Which of the following is NOT an ordinary mode of payment of wages listed under the Code?","o":{"A":"Current coin","B":"Currency notes","C":"Direct credit into a bank account","D":"Goods supplied by the employer"},"a":"D","e":"The specified modes include coin, currency notes, cheque, bank-account credit and electronic payment."},{"set":"Set 4 – 100 Important MCQs","n":37,"q":"The appropriate Government may notify establishments in which wages must be paid through:","o":{"A":"Goods or services","B":"Cheque or direct bank-account credit","C":"Barter alone","D":"Employer-issued vouchers alone"},"a":"B","e":"The Code permits the appropriate Government to require specified establishments to use these payment modes."},{"set":"Set 4 – 100 Important MCQs","n":38,"q":"Which of the following is a permitted wage period under the Code?","o":{"A":"Every 45 days only","B":"Every three months only","C":"A fortnight","D":"Once every financial year only"},"a":"C","e":"Wage periods may be daily, weekly, fortnightly or monthly, subject to the applicable requirements."},{"set":"Set 4 – 100 Important MCQs","n":39,"q":"What is the maximum wage period permitted under the Code?","o":{"A":"One week","B":"One fortnight","C":"One month","D":"Three months"},"a":"C","e":"The wage period cannot exceed one month."},{"set":"Set 4 – 100 Important MCQs","n":40,"q":"Under the stated rule, when an employee is removed or dismissed, the wages payable must ordinarily be paid within:","o":{"A":"Two working days","B":"Seven calendar days","C":"Fifteen days","D":"Thirty days"},"a":"A","e":"The material identifies two working days as the deadline for final wage payment following specified events such as removal or dismissal."},{"set":"Set 4 – 100 Important MCQs","n":41,"q":"An employer deducts ₹2,000 from an employee's wages for a reason not authorised by the Code. Which statement is correct?","o":{"A":"The deduction is valid if the employer gives notice.","B":"The deduction is valid if the employee earns a high salary.","C":"The deduction is not permitted merely because the employer wants it.","D":"The deduction is valid if it is below 50% of wages."},"a":"C","e":"Section 18 permits only deductions authorised under the Code."},{"set":"Set 4 – 100 Important MCQs","n":42,"q":"An employee is paid ₹25,000 and is subsequently required to return ₹2,000 to the employer. For the purpose of Section 18, the return payment is treated as:","o":{"A":"A bonus","B":"A deduction from wages","C":"A pension contribution","D":"A promotion benefit"},"a":"B","e":"A payment made by an employee to the employer or the employer's agent is treated as a deduction from wages."},{"set":"Set 4 – 100 Important MCQs","n":43,"q":"An employee causes actual damage of ₹4,000 through negligence. What is the maximum deduction that may be made for that loss under the stated rule?","o":{"A":"₹2,000","B":"₹4,000","C":"₹8,000","D":"₹10,000"},"a":"B","e":"A deduction for damage or loss directly attributable to an employee's neglect or default cannot exceed the actual loss."},{"set":"Set 4 – 100 Important MCQs","n":44,"q":"What is the maximum deduction for an authorised amenity or service valued at ₹1,200?","o":{"A":"₹600","B":"₹900","C":"₹1,200","D":"₹1,500"},"a":"C","e":"The deduction cannot exceed the value of the amenity or service."},{"set":"Set 4 – 100 Important MCQs","n":45,"q":"Which of the following is specifically excluded from the meaning of services for wage-deduction purposes?","o":{"A":"Employer-provided accommodation","B":"Authorised employee amenities","C":"Tools and raw materials required for employment","D":"An authorised welfare service"},"a":"C","e":"Tools and raw materials required for employment are excluded from the stated meaning of services."},{"set":"Set 4 – 100 Important MCQs","n":46,"q":"Which of the following may be recovered through an authorised deduction relating to advances?","o":{"A":"An eligible travelling allowance advance","B":"An eligible conveyance allowance advance","C":"An overpayment of wages","D":"All of the above"},"a":"D","e":"The stated recovery provisions cover specified advances and overpayments, subject to the applicable conditions."},{"set":"Set 4 – 100 Important MCQs","n":47,"q":"An employee earns ₹30,000 in a wage period. What is the normal maximum total deduction under Section 18(3)?","o":{"A":"₹7,500","B":"₹10,000","C":"₹15,000","D":"₹20,000"},"a":"C","e":"The normal limit is 50% of wages. Calculation: ₹30,000 × 50% = ₹15,000."},{"set":"Set 4 – 100 Important MCQs","n":48,"q":"Authorised deductions total ₹14,000 while the employee's wages are ₹20,000. What is the amount above the normal 50% ceiling?","o":{"A":"₹2,000","B":"₹3,000","C":"₹4,000","D":"₹5,000"},"a":"C","e":"The normal ceiling is ₹10,000. Therefore, ₹14,000 − ₹10,000 = ₹4,000. The excess may be recovered in the prescribed manner."},{"set":"Set 4 – 100 Important MCQs","n":49,"q":"Which deduction requires written authorisation from the employee under the stated provision?","o":{"A":"An arbitrary penalty imposed by the employer","B":"A contribution towards Trade Union membership fees","C":"Any deduction the employer chooses","D":"A deduction exceeding the actual damage caused"},"a":"B","e":"Written authorisation is required for the stated Trade Union membership-fee or contribution deduction."},{"set":"Set 4 – 100 Important MCQs","n":50,"q":"An employer deducts money from wages for deposit into a legally required fund but fails to deposit it. Who is responsible for that failure?","o":{"A":"The employee","B":"The employer","C":"The Trade Union","D":"The beneficiary employee alone"},"a":"B","e":"The employee is not responsible for the employer's failure to deposit the deducted amount into the fund."},{"set":"Set 4 – 100 Important MCQs","n":51,"q":"Before an employer imposes a fine, the act or omission must have been specified with previous approval of:","o":{"A":"The employee's family","B":"The appropriate Government or prescribed authority","C":"The local police in every case","D":"The employer's accountant"},"a":"B","e":"The act or omission must satisfy the statutory approval requirements before a fine can be imposed."},{"set":"Set 4 – 100 Important MCQs","n":52,"q":"Before imposing a fine on an employee, the employer must provide:","o":{"A":"An automatic promotion","B":"An opportunity to show cause","C":"A guaranteed bonus","D":"A transfer to another department"},"a":"B","e":"The employee must have an opportunity to explain why the fine should not be imposed."},{"set":"Set 4 – 100 Important MCQs","n":53,"q":"What is the maximum total fine permitted in one wage period under Section 19?","o":{"A":"1% of wages payable","B":"2% of wages payable","C":"3% of wages payable","D":"10% of wages payable"},"a":"C","e":"The total fine in one wage period cannot exceed 3% of the wages payable for that period."},{"set":"Set 4 – 100 Important MCQs","n":54,"q":"An employee's wages for a wage period are ₹20,000. What is the maximum total fine under the stated 3% limit?","o":{"A":"₹200","B":"₹400","C":"₹600","D":"₹1,000"},"a":"C","e":"₹20,000 × 3% = ₹600."},{"set":"Set 4 – 100 Important MCQs","n":55,"q":"Under Section 19, a fine cannot be imposed on an employee below which age?","o":{"A":"12 years","B":"14 years","C":"15 years","D":"18 years"},"a":"C","e":"The stated restriction prohibits imposing a fine on an employee below 15 years of age."},{"set":"Set 4 – 100 Important MCQs","n":56,"q":"Which statement correctly describes recovery of a fine?","o":{"A":"It may always be recovered in instalments.","B":"It may be recovered at any time without a deadline.","C":"It cannot be recovered in instalments or after 90 days from the day it was imposed.","D":"It must be recovered within 24 hours in every case."},"a":"C","e":"Section 19 prohibits instalment recovery and bars recovery after the stated 90-day period."},{"set":"Set 4 – 100 Important MCQs","n":57,"q":"For the statutory rule discussed, a fine is deemed to have been imposed on:","o":{"A":"The date of the employee's next promotion","B":"The date of the act or omission","C":"The end of the financial year","D":"The date of the annual audit"},"a":"B","e":"The deemed date is linked to the act or omission for which the fine is imposed."},{"set":"Set 4 – 100 Important MCQs","n":58,"q":"Fines collected under the Code must be applied to:","o":{"A":"The employer's personal expenses","B":"Shareholder dividends","C":"Purposes beneficial to the employees","D":"Unrelated commercial investments"},"a":"C","e":"The proceeds of fines must be used for employee- beneficial purposes as prescribed."},{"set":"Set 4 – 100 Important MCQs","n":59,"q":"Under Section 26(1), an employee must have worked for at least how many days in an accounting year to qualify for minimum bonus, subject to the statutory conditions?","o":{"A":"15 days","B":"30 days","C":"60 days","D":"90 days"},"a":"B","e":"The stated minimum service requirement is 30 days in the accounting year."},{"set":"Set 4 – 100 Important MCQs","n":60,"q":"What is the minimum bonus rate specified under Section 26(1)?","o":{"A":"5% of wages or ₹100, whichever is higher","B":"8⅓% of wages or ₹100, whichever is higher","C":"10% of wages or ₹500, whichever is higher","D":"20% of wages or ₹100, whichever is higher"},"a":"B","e":"The minimum bonus is 8⅓% of the relevant wages or ₹100, whichever is higher, subject to eligibility."},{"set":"Set 4 – 100 Important MCQs","n":61,"q":"Under the stated minimum-bonus rule, minimum bonus may remain payable even when:","o":{"A":"The employee has not completed the required minimum working days.","B":"The employer has no allocable surplus, provided the employee satisfies the eligibility conditions.","C":"The employee falls within a statutory disqualification.","D":"The employee is outside the scope of the applicable chapter."},"a":"B","e":"The minimum-bonus provision applies even in the absence of allocable surplus, subject to the statutory eligibility conditions."},{"set":"Set 4 – 100 Important MCQs","n":62,"q":"An eligible employee's relevant annual wages are ₹1,44,000. What is 8⅓% of those wages?","o":{"A":"₹8,000","B":"₹10,000","C":"₹12,000","D":"₹14,400"},"a":"C","e":"8⅓% is one-twelfth. Therefore, ₹1,44,000 ÷ 12 = ₹12,000."},{"set":"Set 4 – 100 Important MCQs","n":63,"q":"What is the maximum bonus rate specified under Section 26(3)?","o":{"A":"8⅓%","B":"12%","C":"20%","D":"25%"},"a":"C","e":"The stated statutory maximum bonus is 20% of the relevant wages."},{"set":"Set 4 – 100 Important MCQs","n":64,"q":"An employee's relevant annual wages for bonus calculation are ₹1,44,000. What is the maximum bonus at 20%?","o":{"A":"₹12,000","B":"₹18,000","C":"₹24,000","D":"₹28,800"},"a":"D","e":"₹1,44,000 × 20% = ₹28,800."},{"set":"Set 4 – 100 Important MCQs","n":65,"q":"An employer and employees agree to a productivity-linked bonus of 25%. Is the amount permissible under the stated maximum-bonus rule?","o":{"A":"Yes, because the bonus is productivity-linked.","B":"Yes, if every employee agrees.","C":"No, because the total bonus cannot exceed the statutory maximum of 20%.","D":"No, because productivity-linked bonus is always prohibited."},"a":"C","e":"An agreement for productivity-linked bonus does not override the stated 20% maximum."},{"set":"Set 4 – 100 Important MCQs","n":66,"q":"During the first five accounting years after a new establishment starts selling goods or providing services, bonus is payable under the stated special rule:","o":{"A":"In every year irrespective of profit","B":"Only in accounting years in which the employer actually derives profit","C":"Only in the first accounting year","D":"Only when set-on is available"},"a":"B","e":"The special rule for the first five accounting years links bonus liability to actual profit."},{"set":"Set 4 – 100 Important MCQs","n":67,"q":"During the first five accounting years covered by the special rule for a new establishment, which mechanism does not apply?","o":{"A":"The eligibility requirement","B":"Consideration of actual profit","C":"Set-on and set-off under Section 36","D":"The definition of accounting year"},"a":"C","e":"The stated special rule excludes the ordinary set-on/set- off mechanism during the first five accounting years."},{"set":"Set 4 – 100 Important MCQs","n":68,"q":"Which sequence correctly represents the stated treatment of a new establishment under Section 26?","o":{"A":"Years 1–3 special; Years 4–5 normal; Year 6 no bonus","B":"Years 1–5 special; Years 6–7 modified set-on/set-off; Year 8 onward normal rules","C":"Years 1–5 normal; Years 6–7 no bonus; Year 8 special","D":"Years 1–7 special; Year 8 onward no bonus"},"a":"B","e":"This is the sequence described for the special treatment of new establishments."},{"set":"Set 4 – 100 Important MCQs","n":69,"q":"Under Section 27, minimum bonus may be reduced proportionately when an employee:","o":{"A":"Works throughout the accounting year","B":"Does not work all the working days in the accounting year, subject to the statutory conditions","C":"Receives a promotion during the year","D":"Receives wages by bank transfer"},"a":"B","e":"Proportionate reduction may apply where the employee has not worked all the relevant working days."},{"set":"Set 4 – 100 Important MCQs","n":70,"q":"An employee's otherwise payable minimum bonus is ₹12,000. There are 300 working days in the accounting year, and the employee works 150 days. What is the proportionately reduced amount?","o":{"A":"₹3,000","B":"₹4,000","C":"₹6,000","D":"₹9,000"},"a":"C","e":"₹12,000 × 150/300 = ₹6,000."},{"set":"Set 4 – 100 Important MCQs","n":71,"q":"Which of the following is counted as a day worked for bonus purposes under Section 28?","o":{"A":"Every unauthorised absence","B":"Every unpaid strike day","C":"Qualifying lay-off days","D":"Every day of voluntary absence without wages"},"a":"C","e":"The specified deemed working days include qualifying lay-off days, paid leave, temporary employment-related disablement and maternity leave with salary or wages."},{"set":"Set 4 – 100 Important MCQs","n":72,"q":"Which circumstance can disqualify an employee from receiving bonus under Section 29?","o":{"A":"Ordinary absence alone","B":"Low productivity alone","C":"Dismissal for fraud","D":"Resignation in every case"},"a":"C","e":"Fraud is one of the specified grounds for disqualification."},{"set":"Set 4 – 100 Important MCQs","n":73,"q":"Which combination contains specified grounds for disqualification from bonus?","o":{"A":"Ordinary lateness and every minor error","B":"Fraud, theft, misappropriation and sabotage","C":"Transfer and promotion","D":"Retirement and completion of service"},"a":"B","e":"The listed grounds include fraud, theft, misappropriation, sabotage and riotous or violent behaviour on the premises. Conviction for sexual harassment is also specified."},{"set":"Set 4 – 100 Important MCQs","n":74,"q":"As a general rule under Section 30, departments, undertakings and branches of an establishment are treated for bonus purposes as:","o":{"A":"Separate establishments in every case","B":"One establishment","C":"Separate establishments only when they share a manager","D":"Separate establishments only when they are in different States"},"a":"B","e":"The general rule treats departments, undertakings and branches as one establishment, whether they are located at the same place or different places."},{"set":"Set 4 – 100 Important MCQs","n":75,"q":"Under the stated exception in Section 30, which condition is relevant to treating a department as a separate establishment?","o":{"A":"It has

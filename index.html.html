a different manager.","B":"It has a separate office building.","C":"It has a separate balance sheet and a separate profit and loss account.","D":"It employs more than 100 employees."},"a":"C","e":"Separate accounts are relevant to the exception, subject to the statutory conditions, including the unit's previous treatment where applicable."},{"set":"Set 4 – 100 Important MCQs","n":76,"q":"What proportion of available surplus constitutes allocable surplus for a banking company under Section 31?","o":{"A":"50%","B":"60%","C":"67%","D":"75%"},"a":"B","e":"The stated allocable-surplus rate for banking companies is 60% of available surplus."},{"set":"Set 4 – 100 Important MCQs","n":77,"q":"What proportion of available surplus constitutes allocable surplus for establishments other than banking companies under Section 31?","o":{"A":"50%","B":"60%","C":"67%","D":"80%"},"a":"C","e":"The stated rate for other establishments is 67% of available surplus."},{"set":"Set 4 – 100 Important MCQs","n":78,"q":"A banking company has an available surplus of ₹10 crore. What is its allocable surplus at 60%?","o":{"A":"₹4 crore","B":"₹5 crore","C":"₹6 crore","D":"₹6.7 crore"},"a":"C","e":"₹10 crore × 60% = ₹6 crore."},{"set":"Set 4 – 100 Important MCQs","n":79,"q":"A non-banking establishment has an available surplus of ₹10 crore. What is its allocable surplus at 67%?","o":{"A":"₹5 crore","B":"₹6 crore","C":"₹6.7 crore","D":"₹7.5 crore"},"a":"C","e":"₹10 crore × 67% = ₹6.7 crore."},{"set":"Set 4 – 100 Important MCQs","n":80,"q":"Which sequence correctly represents the basic calculation chain for bonus?","o":{"A":"Bonus → Gross profits → Available surplus → Allocable surplus","B":"Gross profits → Available surplus → Allocable surplus → Bonus","C":"Available surplus → Bonus → Gross profits → Allocable surplus","D":"Allocable surplus → Gross profits → Bonus → Available surplus"},"a":"B","e":"Gross profits are used to calculate available surplus; the allocable portion is then determined for bonus purposes."},{"set":"Set 4 – 100 Important MCQs","n":81,"q":"Under Section 33, available surplus is basically calculated by:","o":{"A":"Adding specified deductions to gross profits","B":"Subtracting the specified deductions under Section 34 from gross profits, subject to the statutory tax adjustment","C":"Multiplying gross profits by 20%","D":"Subtracting allocable surplus from total wages"},"a":"B","e":"The calculation starts with gross profits and deducts the specified prior charges."},{"set":"Set 4 – 100 Important MCQs","n":82,"q":"Which of the following is one of the specified prior charges under Section 34?","o":{"A":"Depreciation","B":"Bonus for the following accounting year","C":"Employee promotion expenses in every case","D":"Shareholder dividends without any statutory basis"},"a":"A","e":"The specified prior charges include depreciation, direct tax and other prescribed sums."},{"set":"Set 4 – 100 Important MCQs","n":83,"q":"For the special direct-tax calculation under Section 35, which of the following is ignored?","o":{"A":"Previous year's carried-forward losses only","B":"Arrears of depreciation only","C":"Both previous year's carried-forward losses and arrears of depreciation","D":"Neither previous year's carried-forward losses nor arrears of depreciation"},"a":"C","e":"Both are ignored for the special direct-tax calculation described."},{"set":"Set 4 – 100 Important MCQs","n":84,"q":"When allocable surplus remains after providing for the maximum bonus, the excess is generally carried forward as:","o":{"A":"Set-off","B":"Set-on","C":"A fine","D":"A wage deduction"},"a":"B","e":"Excess allocable surplus is carried forward as set-on, subject to the statutory rules."},{"set":"Set 4 – 100 Important MCQs","n":85,"q":"Under Section 36, set-on is subject to a maximum of:","o":{"A":"8⅓% of total wages","B":"10% of total wages","C":"20% of total salary or wages for the accounting year","D":"50% of total wages"},"a":"C","e":"The stated maximum set-on limit is 20% of total salary or wages for the accounting year."},{"set":"Set 4 – 100 Important MCQs","n":86,"q":"For how many succeeding accounting years may set-on and set-off generally be carried forward under Section 36?","o":{"A":"One succeeding accounting year","B":"Two succeeding accounting years","C":"Three succeeding accounting years","D":"Up to and including the fourth succeeding accounting year"},"a":"D","e":"The stated carry-forward period extends up to and including the fourth succeeding accounting year."},{"set":"Set 4 – 100 Important MCQs","n":87,"q":"If there is a deficiency in allocable surplus and insufficient set- on from previous years, the deficiency is carried forward as:","o":{"A":"Set-on","B":"Set-off","C":"Interim bonus","D":"Customary bonus"},"a":"B","e":"A shortfall is treated as set-off and carried forward under the applicable rules."},{"set":"Set 4 – 100 Important MCQs","n":88,"q":"Under the stated bonus provisions, bonus is normally payable within what period from the close of the accounting year?","o":{"A":"Two months","B":"Four months","C":"Six months","D":"Eight months"},"a":"D","e":"The normal payment deadline stated is eight months from the close of the accounting year, subject to the applicable provisions and permitted extensions."},{"set":"Set 4 – 100 Important MCQs","n":89,"q":"Which of the following employees is specifically excluded from the application of the bonus chapter under Section 41?","o":{"A":"Every employee of a private insurance company","B":"An employee of the Life Insurance Corporation of India (LIC)","C":"Every employee of a manufacturing company","D":"Every employee of a private bank"},"a":"B","e":"LIC employees are specifically included in the exclusions listed under Section 41."},{"set":"Set 4 – 100 Important MCQs","n":90,"q":"For Section 41, the statutory definition of a seaman is taken from which Act?","o":{"A":"Factories Act, 1948","B":"Merchant Shipping Act, 1958","C":"Payment of Wages Act, 1936","D":"Industrial Relations Code, 2020"},"a":"B","e":"Section 41 refers to the definition of seaman under the Merchant Shipping Act, 1958."},{"set":"Set 4 – 100 Important MCQs","n":91,"q":"Under Section 51, who appoints the Inspector-cum-Facilitator?","o":{"A":"The employer alone","B":"The appropriate Government","C":"The employee's trade union","D":"The local municipal council in every case"},"a":"B","e":"Section 51 provides for appointment of Inspector-cum- Facilitators by the appropriate Government."},{"set":"Set 4 – 100 Important MCQs","n":92,"q":"Under Section 52, which of the following may make a complaint for an offence under the Code?","o":{"A":"Any member of the public without restriction","B":"An employee","C":"Any commercial competitor of the employer","D":"Any customer of the establishment"},"a":"B","e":"The specified persons include an employee, an authorised officer of the appropriate Government, a registered Trade Union and an Inspector-cum-Facilitator, as applicable."},{"set":"Set 4 – 100 Important MCQs","n":93,"q":"Under Section 52(2), an offence under the Code may be tried by:","o":{"A":"Only an Executive Magistrate","B":"Only a District Magistrate","C":"A Metropolitan Magistrate or Judicial Magistrate First Class","D":"Only a civil court"},"a":"C","e":"These are the specified levels of criminal court under the provision discussed."},{"set":"Set 4 – 100 Important MCQs","n":94,"q":"Under Section 53, the enquiry officer appointed by the appropriate Government must not be below which rank?","o":{"A":"Assistant Secretary","B":"Under Secretary","C":"Joint Secretary","D":"Cabinet Secretary"},"a":"B","e":"The stated minimum rank is Under Secretary to the Government of India or an equivalent-rank State Government officer."},{"set":"Set 4 – 100 Important MCQs","n":95,"q":"Under Section 68, which authority may issue an order to remove difficulties arising in giving effect to the Code?","o":{"A":"The employer","B":"The Central Government","C":"The employee's trade union","D":"Any private company"},"a":"B","e":"Section 68 empowers the Central Government to make orders for removing difficulties, subject to the provision's conditions."},{"set":"Set 4 – 100 Important MCQs","n":96,"q":"Under Section 68, the power to issue an order for removing difficulties is limited to a maximum period of:","o":{"A":"One year from commencement","B":"Two years from commencement","C":"Three years from commencement","D":"Five years from commencement"},"a":"C","e":"The stated maximum period is three years from the commencement of the Code."},{"set":"Set 4 – 100 Important MCQs","n":97,"q":"Which of the following Acts is repealed under Section 69 of the Code on Wages, 2019?","o":{"A":"Companies Act, 2013","B":"Payment of Wages Act, 1936","C":"Indian Contract Act, 1872","D":"Constitution of India"},"a":"B","e":"Section 69 repeals specified earlier wage-related laws, including the Payment of Wages Act, 1936."},{"set":"Set 4 – 100 Important MCQs","n":98,"q":"Which of the following laws is also included in the repeal provision under Section 69?","o":{"A":"Minimum Wages Act, 1948","B":"Transfer of Property Act, 1882","C":"Indian Evidence Act, 1872","D":"Representation of the People Act, 1951"},"a":"A","e":"The repeal provision includes the Minimum Wages Act, 1948, along with other specified labour laws."},{"set":"Set 4 – 100 Important MCQs","n":99,"q":"Which statement correctly describes the saving provision under Section 69?","o":{"A":"Every action taken under previous laws is automatically cancelled.","B":"Previous actions are preserved to the extent they are not contrary to the Code, subject to the saving provision.","C":"All previous actions override the Code permanently.","D":"The repeal has no effect on any previous law."},"a":"B","e":"The repeal provision preserves qualifying previous actions and also provides for the application of Section 6 of the General Clauses Act, 1897."},{"set":"Set 4 – 100 Important MCQs","n":100,"q":"Which combination correctly matches the key numerical provisions discussed in the Code on Wages?","o":{"A":"Total wage deductions — 25%; maximum fine — 10%; minimum wage revision — 10 years","B":"Total wage deductions — 50%; maximum fine — 3%; minimum wage revision interval — not more than 5 years","C":"Total wage deductions — 75%; maximum fine — 5%; minimum wage revision — 2 years","D":"Total wage deductions — 100%; maximum fine — 20%; minimum wage revision — 15 years"},"a":"B","e":"These are three distinct numerical limits: •   50% — normal ceiling on total wage deductions. •   3% — maximum total fine in one wage period. •   5 years — maximum stated interval for reviewing or revising minimum wages."},{"set":"Set 5 – Advisory Boards, Claims & Appeals","n":1,"q":"Under Section 42(1), how many representatives of State Governments are nominated to the Central Advisory Board by the Central Government?","o":{"A":"3 representatives","B":"5 representatives","C":"7 representatives","D":"10 representatives"},"a":"B","e":"Section 42(1) provides for five representatives of State Governments on the Central Advisory Board, nominated by the Central Government."},{"set":"Set 5 – Advisory Boards, Claims & Appeals","n":2,"q":"Under Section 42, independent persons on the Central Advisory Board cannot exceed what proportion of its total membership?","o":{"A":"One-fourth","B":"One-third","C":"One-half","D":"Two-thirds"},"a":"B","e":"Independent persons cannot exceed one-third of the total membership of the Central Advisory Board."},{"set":"Set 5 – Advisory Boards, Claims & Appeals","n":3,"q":"Who appoints the Chairperson of the Central Advisory Board under Section 42?","o":{"A":"The State Government","B":"The Labour Commissioner","C":"The Central Government","D":"The employees’ representatives"},"a":"C","e":"The Chairperson must be an independent member appointed by the Central Government."},{"set":"Set 5 – Advisory Boards, Claims & Appeals","n":4,"q":"Which of the following is a function of the Central Advisory Board under Section 42(3)?","o":{"A":"Conducting criminal trials against employers","B":"Advising on the fixation and revision of minimum wages","C":"Issuing judicial decrees for recovery of wages","D":"Appointing all Inspector-cum-Facilitators in India"},"a":"B","e":"The Central Advisory Board advises the Central Government on minimum wages, women’s employment opportunities and other matters relating to the Code referred to it."},{"set":"Set 5 – Advisory Boards, Claims & Appeals","n":5,"q":"Who appoints the Chairperson of a committee or sub- committee constituted by the State Advisory Board?","o":{"A":"The Central Government","B":"The State Government","C":"The State Advisory Board","D":"The appropriate Government’s claims authority"},"a":"C","e":"The State Advisory Board appoints the Chairperson of its committees and sub-committees. This differs from the appointment of the Chairperson of the State Advisory Board itself, who is appointed by the State Government."},{"set":"Set 5 – Advisory Boards, Claims & Appeals","n":6,"q":"Under Section 43, who is primarily responsible for paying amounts due to an employee under the Code?","o":{"A":"The employee’s trade union","B":"The employer","C":"The District Magistrate in every case","D":"The Central Advisory Board"},"a":"B","e":"Section 43 places responsibility for payment of amounts payable under the Code on the employer."},{"set":"Set 5 – Advisory Boards, Claims & Appeals","n":7,"q":"Under Section 44, if an employee dies before receiving an amount payable under the Code, who should ordinarily receive the amount first?","o":{"A":"The Inspector-cum-Facilitator","B":"The employer","C":"The employee’s nominee","D":"The State Advisory Board"},"a":"C","e":"The amount is paid to the nominee according to the prescribed rules. If there is no nominee or the nominee cannot receive it, the amount is deposited with the prescribed authority."},{"set":"Set 5 – Advisory Boards, Claims & Appeals","n":8,"q":"What is the maximum compensation that the claims authority may award under Section 45(2), in relation to the claim amount determined?","o":{"A":"Equal to the claim amount","B":"Twice the claim amount","C":"Five times the claim amount","D":"Ten times the claim amount"},"a":"D","e":"Compensation may be awarded up to ten times the claim amount determined. This compensation is in addition to the original claim amount."},{"set":"Set 5 – Advisory Boards, Claims & Appeals","n":9,"q":"Within what period should the claims authority endeavour to decide a claim under Section 45?","o":{"A":"30 days","B":"60 days","C":"3 months","D":"1 year"},"a":"C","e":"Section 45 provides that the authority should endeavour to decide the claim within three months."},{"set":"Set 5 – Advisory Boards, Claims & Appeals","n":10,"q":"What is the normal limitation period for filing a claim under Section 45(6)?","o":{"A":"30 days","B":"90 days","C":"1 year","D":"3 years"},"a":"D","e":"A claim application must normally be filed within three years from the date the claim arises. A delayed application may be accepted if sufficient cause is shown."},{"set":"Set 5 – Advisory Boards, Claims & Appeals","n":11,"q":"Which of the following may file a claim application under Section 45(4)?","o":{"A":"Only the employee concerned","B":"Only the employer","C":"The employee concerned, a registered trade union of which the employee is a member, or an Inspector-cum-Facilitator","D":"Only the Central Government"},"a":"C","e":"Section 45(4) identifies these three categories as persons who may apply to the claims authority."},{"set":"Set 5 – Advisory Boards, Claims & Appeals","n":12,"q":"Under Section 46, a dispute between an employer and employees regarding the eligibility of employees for bonus is treated as:","o":{"A":"A civil property dispute only","B":"An industrial dispute under the Industrial Disputes Act, 1947","C":"A criminal appeal under the Code","D":"A dispute exclusively for the Central Advisory Board"},"a":"B","e":"Section 46 specifically covers disputes concerning bonus fixation or eligibility and certain disputes about the application of bonus provisions to public-sector establishments."},{"set":"Set 5 – Advisory Boards, Claims & Appeals","n":13,"q":"Under Section 47, what may the authority do when properly audited balance sheets and profit-and-loss accounts are produced in a bonus dispute involving a covered company?","o":{"A":"It must reject the accounts","B":"It may presume the accounts to be accurate","C":"It must order a fresh audit in every case","D":"It must accept the accounts without exception"},"a":"B","e":"Properly audited accounts may be presumed accurate. However, if the authority doubts their accuracy, it may take steps to verify them."},{"set":"Set 5 – Advisory Boards, Claims & Appeals","n":14,"q":"Within how many days must an appeal ordinarily be filed under Section 49 against an order covered by that section?","o":{"A":"30 days","B":"60 days","C":"90 days","D":"180 days"},"a":"C","e":"Section 49 allows an appeal within 90 days from the date of the order. Delay may be condoned if sufficient cause is established."},{"set":"Set 5 – Advisory Boards, Claims & Appeals","n":15,"q":"Which of the following is specifically required under Section 50 for covered employers?","o":{"A":"Issuing wage slips to employees in the prescribed form and manner","B":"Obtaining approval from the Central Advisory Board before every wage payment","C":"Filing every wage dispute directly before a tribunal","D":"Appointing a separate claims authority within each establishment"},"a":"A","e":"Section 50 requires covered employers to maintain prescribed registers, display specified notices and issue wage slips. A limited exemption applies to employers who employ no more than five persons for agricultural or domestic purposes, subject to the statutory conditions."},{"set":"Set 6 – Offences & Penalties","n":1,"q":"Under Section 52(1), who is permitted to file a complaint for an offence under the Code?","o":{"A":"Any member of the public","B":"Only a police officer","C":"The employee concerned","D":"Only the employer"},"a":"C","e":"Section 52(1) specifies who may file a complaint for an offence under the Code."},{"set":"Set 6 – Offences & Penalties","n":2,"q":"Under Section 52(2), which court is competent to try an offence under the Code?","o":{"A":"District Court","B":"Metropolitan Magistrate or Judicial Magistrate First Class","C":"High Court","D":"Civil Judge Junior Division"},"a":"B","e":"An offence under the Code must be tried by a court of the specified magistrate level."},{"set":"Set 6 – Offences & Penalties","n":3,"q":"Under Section 53(1), what is the minimum rank of the officer authorised to conduct the penalty enquiry?","o":{"A":"Under Secretary to the Government of India or an equivalent State Government officer","B":"Section Officer","C":"Assistant Labour Inspector","D":"Junior Clerk"},"a":"A","e":"Section 53 prescribes the minimum rank of the officer authorised to conduct the enquiry."},{"set":"Set 6 – Offences & Penalties","n":4,"q":"Which of the following powers may be exercised by the officer conducting an enquiry under Section 53?","o":{"A":"Power to amend the Code","B":"Power to dissolve a company","C":"Power to make constitutional amendments","D":"Power to summon persons and require evidence or documents"},"a":"D","e":"The officer has specified powers to conduct the enquiry, including summoning persons and requiring evidence or documents."},{"set":"Set 6 – Offences & Penalties","n":5,"q":"Under Section 54(1)(a), what is the maximum fine for paying less than the amount due to an employee?","o":{"A":"₹10,000","B":"₹20,000","C":"₹50,000","D":"₹1,00,000"},"a":"C","e":"Section 54(1)(a) prescribes a maximum fine of ₹50,000 for the specified offence of underpayment."},{"set":"Set 6 – Offences & Penalties","n":6,"q":"Under Section 54(1)(b), what may be the punishment for a repeat underpayment offence committed within five years?","o":{"A":"Warning only","B":"Imprisonment up to three months, or fine up to ₹1 lakh, or both","C":"Imprisonment up to one year only","D":"Fine up to ₹5,000 only"},"a":"B","e":"The provision prescribes a higher punishment for a repeat underpayment offence within the specified five-year period."},{"set":"Set 6 – Offences & Penalties","n":7,"q":"Under Section 54(1)(c), what is the maximum fine for another contravention for which no separate penalty is provided?","o":{"A":"₹20,000","B":"₹50,000","C":"₹1,00,000","D":"₹5,000"},"a":"A","e":"Section 54(1)(c) provides for a fine of up to ₹20,000 for the specified other contraventions."},{"set":"Set 6 – Offences & Penalties","n":8,"q":"What is the maximum fine for the specified failure to maintain or produce records under Section 54(2)?","o":{"A":"₹2,000","B":"₹5,000","C":"₹20,000","D":"₹10,000"},"a":"D","e":"Section 54(2) prescribes a fine of up to ₹10,000 for the specified records-related offence."},{"set":"Set 6 – Offences & Penalties","n":9,"q":"Under Section 54(3), what must generally happen before prosecution for a qualifying first offence covered by this provision?","o":{"A":"The employer must be imprisoned first","B":"A written direction must be given to comply within the prescribed period","C":"The establishment must be permanently closed","D":"The employee must withdraw the complaint"},"a":"B","e":"For a qualifying first offence, the provision requires a prior written compliance direction, subject to the statutory conditions."},{"set":"Set 6 – Offences & Penalties","n":10,"q":"What happens when the same-nature violation is repeated within five years, as described under Section 54(3)?","o":{"A":"The employer automatically receives another warning","B":"The offence is automatically compounded","C":"The fresh opportunity to comply does not apply","D":"The earlier offence is cancelled"},"a":"C","e":"A repeat violation of the same nature within the specified period is not entitled to the same fresh compliance opportunity."},{"set":"Set 6 – Offences & Penalties","n":11,"q":"Under Section 55(1), when an offence is committed by a company, who may be held liable under the provision?","o":{"A":"Only the company's customers","B":"Only the company's shareholders in every case","C":"Only the employee who reported the offence","D":"The company and persons responsible for the conduct of its business, subject to the statutory conditions and defences"},"a":"D","e":"Section 55 addresses company liability and the liability of persons responsible for the company's business, subject to the conditions laid down in the section."},{"set":"Set 6 – Offences & Penalties","n":12,"q":"Which defence is available to a person proceeded against under Section 55(1)?","o":{"A":"The offence occurred without their knowledge, or they exercised due diligence to prevent it","B":"The company is popular with customers","C":"The company has operated for more than five years","D":"The employee did not complain publicly"},"a":"A","e":"The provision recognises lack of knowledge and due diligence as relevant defences, subject to its statutory requirements."},{"set":"Set 6 – Offences & Penalties","n":13,"q":"Under Section 55(2), when may a director, manager, secretary or other officer be liable for an offence committed by a company?","o":{"A":"Merely because they work in the same city","B":"When the offence occurred with their consent or connivance, or is attributable to their neglect","C":"Whenever the company makes a profit","D":"Only when the company has no employees"},"a":"B","e":"Section 55(2) addresses liability arising from consent, connivance or neglect by specified company officers."},{"set":"Set 6 – Offences & Penalties","n":14,"q":"For the purposes of Section 55, which of the following is included within the meaning of a company, as described in the provision?","o":{"A":"Only a government department","B":"Only a public limited company","C":"A firm or a limited liability partnership, as specified in the provision","D":"Only a registered trade union"},"a":"C","e":"The section extends the relevant meaning of “company” to include the specified forms of business organisation."},{"set":"Set 6 – Offences & Penalties","n":15,"q":"Under Section 56(1), what is the maximum compounding amount for an offence that is eligible for compounding?","o":{"A":"10% of the maximum fine","B":"25% of the maximum fine","C":"75% of the maximum fine","D":"50% of the maximum fine"},"a":"D","e":"Section 56(1) limits the compounding amount to 50% of the maximum fine prescribed for the offence."},{"set":"Set 6 – Offences & Penalties","n":16,"q":"When is compounding barred under the repeat-offence condition described in Section 56?","o":{"A":"When a similar offence is committed within five years after an earlier compounding or conviction","B":"Whenever the employer has more than 100 employees","C":"Whenever an employee files a written complaint","D":"Whenever the employer pays wages electronically"},"a":"A","e":"The provision restricts compounding for a similar offence committed within the specified five-year period following an earlier compounding or conviction."},{"set":"Set 6 – Offences & Penalties","n":17,"q":"What is the effect of compounding an eligible offence before prosecution is instituted?","o":{"A":"The employer must automatically be imprisoned","B":"The establishment must be closed permanently","C":"Prosecution for that compounded offence shall not be instituted","D":"The employee loses all rights under the Code"},"a":"C","e":"Under the described provision, compounding before institution of prosecution prevents prosecution for the offence that has been compounded."},{"set":"Set 6 – Offences & Penalties","n":18,"q":"Under Section 57, when is an ordinary suit barred in relation to a claim covered by the Code?","o":{"A":"Whenever an employee changes employers","B":"Where the matter has been addressed, adjudged or is recoverable through the mechanisms provided under the Code","C":"Whenever wages are paid in cash","D":"Whenever an employer disputes an employee's identity"},"a":"B","e":"Section 57 bars suits in the specified circumstances where the Code provides the relevant mechanism for the matter or recovery."},{"set":"Set 6 – Offences & Penalties","n":19,"q":"Under Section 59, who bears the burden of proving that wages, bonus or other relevant amounts have been paid in a claim covered by the provision?","o":{"A":"The employee in every case","B":"The police officer","C":"The court clerk","D":"The employer"},"a":"D","e":"Section 59 places the burden of proving payment on the employer for claims covered by the provision."},{"set":"Set 6 – Offences & Penalties","n":20,"q":"Which statement correctly describes Sections 61 and 62 of the Code on Wages, 2019?","o":{"A":"Section 61 provides an overriding effect over inconsistent laws and specified instruments; Section 62 permits delegation of powers by notification","B":"Section 61 deals only with company offences; Section 62 abolishes all penalties","C":"Section 61 concerns only record maintenance; Section 62 deals only with wage deductions","D":"Section 61 prohibits delegation; Section 62 permits delegation only through a court order"},"a":"A","e":"Section 61 gives the Code overriding effect in the specified cases of inconsistency. Section 62 allows the relevant government to delegate powers by notification, subject to the provision's conditions."},{"set":"Set 7 – Bonus Exclusions (Sec 41)","n":1,"q":"Under Section 41(1)(a), employees of which organisation are excluded from the application of this Chapter?","o":{"A":"Employees of the Reserve Bank of India","B":"Employees of the Life Insurance Corporation of India (LIC)","C":"Employees of every private insurance company","D":"Employees of every public sector bank"},"a":"B","e":"Section 41(1)(a) specifically excludes employees of LIC from the application of this Chapter."},{"set":"Set 7 – Bonus Exclusions (Sec 41)","n":2,"q":"Under Section 41(1)(b), the term “seamen” is defined with reference to which legislation?","o":{"A":"Factories Act, 1948","B":"Industrial Disputes Act, 1947","C":"Merchant Shipping Act, 1958","D":"Dock Workers (Regulation of Employment) Act, 1948"},"a":"C","e":"The exclusion applies to seamen as defined under"},{"set":"Set 7 – Bonus Exclusions (Sec 41)","n":3,"q":"Which condition must be satisfied for dock workers to fall under the exclusion in Section 41(1)(c)?","o":{"A":"They must be registered or listed under a statutory dock-worker scheme and employed by registered or listed employers.","B":"They must work only for a private shipping company.","C":"They must have completed at least five years of service.","D":"They must be employed by the Central Government."},"a":"A","e":"The exclusion covers dock workers registered or listed under a scheme made under the Dock Workers (Regulation of Employment) Act, 1948, when employed by registered or listed employers."},{"set":"Set 7 – Bonus Exclusions (Sec 41)","n":4,"q":"Section 41(1)(d) excludes employees of establishments under the authority of which of the following?","o":{"A":"Only the Central Government","B":"Only State Governments","C":"Only local authorities","D":"Central Government departments, State Government departments and local authorities"},"a":"D","e":"The provision covers establishments under the authority of all three categories specified in option D."},{"set":"Set 7 – Bonus Exclusions (Sec 41)","n":5,"q":"Which of the following institutions is specifically covered by the exclusion under Section 41(1)(e)?","o":{"A":"Every profit-making private hospital","B":"The Indian Red Cross Society and its branches","C":"Every private commercial company","D":"Every privately owned shopping mall"},"a":"B","e":"Section 41(1)(e) covers the Indian Red Cross Society, similar institutions and their branches, as specified in the provision."},{"set":"Set 7 – Bonus Exclusions (Sec 41)","n":6,"q":"Under Section 41(1)(e), which factor is important for the exclusion of certain hospitals, chambers of commerce and social welfare institutions?","o":{"A":"The institution must employ more than 100 employees.","B":"The institution must receive financial assistance from a foreign government.","C":"The institution must be established not for purposes of profit.","D":"The institution must be owned by a local authority."},"a":"C","e":"For the specified category of institutions, the important condition is that they are established not for purposes of profit."},{"set":"Set 7 – Bonus Exclusions (Sec 41)","n":7,"q":"Which statement correctly describes the exclusion under Section 41(1)(g) for certain public sector financial institutions?","o":{"A":"Every public sector financial institution is automatically excluded.","B":"Only private banking companies are excluded.","C":"Every financial institution owned by a State Government is automatically excluded.","D":"A public sector financial institution other than a banking company may be excluded if specified by the Central Government through notification."},"a":"D","e":"The exclusion is not automatic. It requires a Central Government notification specifying the institution, after considering relevant factors."},{"set":"Set 7 – Bonus Exclusions (Sec 41)","n":8,"q":"Which of the following is a factor that the Central Government may consider when deciding whether to specify a public sector financial institution under Section 41(1)(g)?","o":{"A":"The institution’s capital structure","B":"The personal income of every employee","C":"The number of holidays observed by the institution","D":"The residential addresses of its employees"},"a":"A","e":"Relevant considerations include capital structure, objectives, the nature of activities, government assistance or concessions, and other relevant factors."},{"set":"Set 7 – Bonus Exclusions (Sec 41)","n":9,"q":"Under Section 41(1)(h), which inland water transport establishment falls within the specified exclusion?","o":{"A":"An establishment operating exclusively within one city","B":"An establishment operating on routes that pass through another country","C":"An establishment operating only within a single state","D":"An establishment providing only road transport services"},"a":"B","e":"The provision covers employees of inland water transport establishments operating on routes that pass through another country."},{"set":"Set 7 – Bonus Exclusions (Sec 41)","n":10,"q":"Under Section 41(1)(i), when may the appropriate Government exempt employees of another establishment by notification?","o":{"A":"Whenever the employer requests an exemption, without any conditions","B":"Whenever the establishment increases its workforce","C":"When the employees already receive overall benefits under another profit-sharing scheme, subject to the provision","D":"Only when the establishment is owned by the Central Government"},"a":"C","e":"The appropriate Government may issue a notification where the employees already receive overall benefits under another profit-sharing scheme, as described in Section 41(1)(i)."}];
const sets=[...new Set(Q.map(q=>q.set))];
let T=null,timer=null,app=document.getElementById('app');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function setup(){clearInterval(timer);
app.innerHTML=`<h1>Code on Wages, 2019 – CBT Practice</h1><div class="card"><h2>1. Choose question sets</h2>
${sets.map((s,i)=>`<label><input type="checkbox" class="sc" value="${i}" checked> ${esc(s)} <span class="mu">(${Q.filter(q=>q.set==s).length})</span></label>`).join('')}</div>
<div class="card"><h2>2. Test settings</h2>
<label>Number of questions <input type="number" id="cnt" min="5" max="235" value="50"> <span class="mu" id="avail"></span></label>
<label>Time (minutes, 0 = untimed) <input type="number" id="tm" min="0" max="300" value="50"></label>
<label>Negative marking (⅓ mark per wrong answer) <input type="checkbox" id="neg" checked></label>
<label><input type="checkbox" id="rnd" checked> Shuffle questions</label>
<label><input type="checkbox" id="rnk"> Shuffle options is off (original order kept)</label></div>
<button class="p" onclick="start()">Start test</button>`;
const upd=()=>{const n=[...document.querySelectorAll('.sc:checked')].reduce((a,c)=>a+Q.filter(q=>q.set==sets[c.value]).length,0);document.getElementById('avail').textContent='(available: '+n+')'};
document.querySelectorAll('.sc').forEach(c=>c.onchange=upd);upd();document.getElementById('rnk').parentElement.remove()}
function start(){let pool=Q.filter(q=>[...document.querySelectorAll('.sc:checked')].some(c=>sets[c.value]==q.set));
if(!pool.length)return alert('Select at least one set.');
if(document.getElementById('rnd').checked)pool=shuf(pool);
const n=Math.min(+document.getElementById('cnt').value||pool.length,pool.length);
const mins=+document.getElementById('tm').value||0;
T={qs:pool.slice(0,n),ans:{},vis:{},mk:{},i:0,neg:document.getElementById('neg').checked,left:mins*60,timed:mins>0,done:false};
if(T.timed)timer=setInterval(()=>{T.left--;if(T.left<=0){clearInterval(timer);submit(true)}else{const e=document.getElementById('clk');if(e)e.textContent=fmt(T.left)}},1000);
render()}
const fmt=s=>String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function st(i){return T.mk[i]?'m':T.ans[i]?'a':T.vis[i]?'n':''}
function render(){const q=T.qs[T.i];T.vis[T.i]=1;
app.innerHTML=`<div class="top"><b>Question ${T.i+1} / ${T.qs.length}</b><span>${T.timed?'⏱ <b id="clk">'+fmt(T.left)+'</b>':'Untimed'}</span><button class="p" onclick="if(confirm('Submit the test now?'))submit()">Submit</button></div>
<div class="card"><div class="tag">${esc(q.set)} · Q${q.n}</div><p style="font-size:1.05rem">${esc(q.q)}</p>
${Object.entries(q.o).map(([k,v])=>`<div class="opt ${T.ans[T.i]==k?'sel':''}" onclick="pick('${k}')"><b>${k}.</b><span>${esc(v)}</span></div>`).join('')}
<div class="row"><button onclick="go(-1)" ${T.i?'':'disabled'}>◀ Previous</button><button onclick="clr()">Clear</button><button onclick="mark()">${T.mk[T.i]?'Unmark':'Mark for review'}</button><span class="sp"></span><button class="p" onclick="go(1)" ${T.i<T.qs.length-1?'':'disabled'}>Save &amp; Next ▶</button></div></div>
<div class="card"><h2>Question palette</h2>${pal()}<p class="lg">Green = answered · Red = not answered · Purple = marked for review · Grey = not visited</p></div>`}
function pal(){return '<div class="pal">'+T.qs.map((_,i)=>`<button class="${st(i)} ${i==T.i?'c':''}" onclick="T.i=${i};render()">${i+1}</button>`).join('')+'</div>'}
const pick=k=>{T.ans[T.i]=k;render()},clr=()=>{delete T.ans[T.i];render()},mark=()=>{T.mk[T.i]=!T.mk[T.i];render()},go=d=>{T.i+=d;render();scrollTo(0,0)};
function submit(auto){clearInterval(timer);T.done=true;let c=0,w=0,u=0;const by={};
T.qs.forEach((q,i)=>{const b=by[q.set]=by[q.set]||{c:0,t:0};b.t++;if(!T.ans[i])u++;else if(T.ans[i]==q.a){c++;b.c++}else w++});
const sc=c-(T.neg?w/3:0);
app.innerHTML=`<h1>${auto?'Time is up! ':''}Result</h1><div class="card"><div class="big">${sc.toFixed(2)} <span class="mu" style="font-size:1rem">/ ${T.qs.length}</span></div>
<p>✅ Correct: <b>${c}</b> · ❌ Wrong: <b>${w}</b> · ⏭ Unattempted: <b>${u}</b> · Accuracy (attempted): <b>${c+w?Math.round(100*c/(c+w)):0}%</b></p>
${Object.entries(by).map(([s,b])=>`<div class="tag">${esc(s)}: ${b.c}/${b.t}</div>`).join('')}</div>
<div class="row" style="margin-bottom:12px"><button class="p" onclick="setup()">New test</button><button onclick="review(0)">Review all</button><button onclick="review(1)">Review wrong &amp; unattempted</button></div><div id="rv"></div>`}
function review(f){document.getElementById('rv').innerHTML=T.qs.map((q,i)=>({q,i})).filter(({q,i})=>!f||T.ans[i]!=q.a).map(({q,i})=>`<div class="card"><div class="tag">Q${i+1} · ${esc(q.set)} · Q${q.n}</div><p>${esc(q.q)}</p>
${Object.entries(q.o).map(([k,v])=>`<div class="opt ${k==q.a?'ok':T.ans[i]==k?'no':''}"><b>${k}.</b><span>${esc(v)}${k==q.a?' ✔':T.ans[i]==k?' ✘ (your answer)':''}</span></div>`).join('')}
${T.ans[i]?'':'<div class="tag">Not attempted</div>'}${q.e?`<div class="ex"><b>Explanation:</b> ${esc(q.e)}</div>`:''}</div>`).join('')||'<div class="card">Nothing to review – perfect score!</div>';document.getElementById('rv').scrollIntoView()}
setup();
</script></body></html>
